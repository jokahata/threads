      + '<button type="button" class="linkish pp-edit" data-action="pp-edit-event" data-id="' + e.id + '">Edit</button></div>'
      + pChipsHtml(e) + '</div></div>';
  }).join('');
}

function lanesHtml_people() {
  const st = pStats();
  const evs = sortedPEvents();
  const who = people.filter((p) => st.get(p.id).count)
    .sort((a, b) => (st.get(b.id).last > st.get(a.id).last ? 1 : st.get(b.id).last < st.get(a.id).last ? -1 : 0) || a.name.localeCompare(b.name));
  if (!who.length) return '<div class="pp-empty">Lanes show up once you\'ve logged someone.</div>';
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const days = PP_RANGES[pui.range];
  const earliest = evs.length ? pDay(evs[evs.length - 1].date) : today;
  const latest = evs.length ? pDay(evs[0].date) : today;
  let start = days ? new Date(today.getTime() - days * DAY_MS) : new Date(earliest.getTime() - 3 * DAY_MS);
  const end = new Date(Math.max(today.getTime(), latest.getTime()) + 3 * DAY_MS);
  if (end - start < 30 * DAY_MS) start = new Date(end.getTime() - 30 * DAY_MS);
  const span = end - start;
  const pct = (d) => ((d - start) / span * 100).toFixed(2) + '%';
  const ticks = [];
  const t = new Date(start.getFullYear(), start.getMonth() + 1, 1);
  const stepM = span > 800 * DAY_MS ? 6 : span > 400 * DAY_MS ? 3 : 1;
  while (t < end) {
    if (t.getMonth() % stepM === 0) ticks.push(new Date(t));
    t.setMonth(t.getMonth() + 1);
  }
  const tickHtml = ticks.map((d) => '<span class="pp-tick" style="left:' + pct(d) + '">' + esc(d.toLocaleDateString(undefined, d.getMonth() === 0 ? { month: 'short', year: '2-digit' } : { month: 'short' })) + '</span>').join('')
    + '<span class="pp-tick pp-today" style="left:' + pct(today) + '">today</span>';
  const grid = ticks.map((d) => '<i class="pp-grid" style="left:' + pct(d) + '"></i>').join('') + '<i class="pp-grid pp-today" style="left:' + pct(today) + '"></i>';
  const rows = who.map((p) => {
    const x = st.get(p.id);
    const n = daysSince(x.last);
    const dots = x.hist.filter((h) => pDay(h.e.date) >= start && pDay(h.e.date) <= end).map((h) =>
      '<button type="button" class="pp-dot" style="left:' + pct(pDay(h.e.date)) + '" data-action="pp-edit-event" data-id="' + h.e.id + '" title="' + esc(dateLabel(h.e.date, true) + ' - ' + (h.e.title || 'Untitled') + (h.s.note ? '\n' + h.s.note : '')) + '"></button>').join('');
    return '<div class="pp-lane"><button type="button" class="pp-lname" data-action="pp-person" data-id="' + p.id + '"><span>' + esc(p.name) + '</span>'
      + '<span class="pp-since ' + staleClass(n) + '">' + sinceShort(n) + '</span></button>'
      + '<div class="pp-track">' + grid + dots + '</div></div>';
  }).join('');
  return '<div class="pp-lanes-bar"><span class="seg">' + Object.keys(PP_RANGES).map((k) => '<button type="button" data-action="pp-range" data-range="' + k + '" class="' + (pui.range === k ? 'on' : '') + '">' + (k === 'all' ? 'All' : k) + '</button>').join('') + '</span>'
    + '<span class="muted">Tap a dot to open that event</span></div>'
    + '<div class="pp-lanes"><div class="pp-lanes-inner"><div class="pp-lane pp-axis"><span class="pp-lname"></span><div class="pp-track">' + tickHtml + '</div></div>' + rows + '</div></div>';
}

function peopleListHtml() {
  const st = pStats();
  const q = pFilter.trim().toLowerCase();
  const list = people.filter((p) => !q || p.name.toLowerCase().includes(q));
  const cmp = {
    since: (a, b) => (st.get(a.id).last || '0') < (st.get(b.id).last || '0') ? -1 : (st.get(a.id).last || '0') > (st.get(b.id).last || '0') ? 1 : a.name.localeCompare(b.name),
    recent: (a, b) => (st.get(a.id).last || '0') > (st.get(b.id).last || '0') ? -1 : (st.get(a.id).last || '0') < (st.get(b.id).last || '0') ? 1 : a.name.localeCompare(b.name),
    count: (a, b) => st.get(b.id).count - st.get(a.id).count || a.name.localeCompare(b.name),
    name: (a, b) => a.name.localeCompare(b.name),
  }[pui.sort] || ((a, b) => a.name.localeCompare(b.name));
  list.sort(cmp);
  return '<div class="pp-plist-bar"><input data-pp="filter" data-focus="pp-filter" value="' + esc(pFilter) + '" placeholder="Find a person" autocomplete="off">'
    + '<select data-pp="sort">' + Object.keys(PP_SORTS).map((k) => '<option value="' + k + '"' + (pui.sort === k ? ' selected' : '') + '>' + PP_SORTS[k] + '</option>').join('') + '</select></div>'
    + (list.length ? '<div class="pp-plist">' + list.map((p) => {
      const x = st.get(p.id);
      const n = daysSince(x.last);
      return '<button type="button" class="pp-prow" data-action="pp-person" data-id="' + p.id + '"><span class="pp-pname">' + esc(p.name || 'Unnamed') + '</span>'
        + '<span class="pp-plast muted">' + (x.last ? dateLabel(x.last) : '') + '</span>'
        + '<span class="pp-since ' + staleClass(n) + '">' + esc(x.last ? sinceLabel(n) : 'not seen yet') + '</span>'
        + '<span class="pp-count muted" title="Times seen">' + x.count + 'x</span></button>';
    }).join('') + '</div>' : '<div class="pp-empty">' + (people.length ? 'No one matches.' : 'People you add in the form show up here.') + '</div>');
}

function personDetailHtml(p) {

  return '<div class="pp-person">'
    + '<div class="pp-person-head"><button type="button" data-action="pp-back">&larr; Back</button>'

    + '<div class="pp-stats"><div><span class="muted">Last seen</span><b class="' + staleClass(n) + '">' + esc(x.last ? sinceLabel(n) : 'not yet') + '</b>' + (x.last ? '<span class="muted">' + esc(dateLabel(x.last, true)) + '</span>' : '') + '</div>'
    + '<div><span class="muted">Times seen</span><b>' + x.count + '</b></div>'
    + '<div><span class="muted">First logged</span><b>' + esc(x.first ? dateLabel(x.first, true) : '-') + '</b></div></div>'

    + '<div class="pp-label">History</div>'
    + (x.hist.length ? '<div class="pp-hist">' + x.hist.map((h) => '<div class="pp-hrow"><span class="pp-hdate">' + esc(dateLabel(h.e.date)) + (h.e.time ? ' <span class="muted">' + esc(timeLabel(h.e.time)) + '</span>' : '') + '</span>'
      + '<span class="pp-htitle"><button type="button" class="linkish" data-action="pp-edit-event" data-id="' + h.e.id + '">' + esc(h.e.title || 'Untitled') + '</button>'
      + (h.s.note ? '<span class="pp-pnote">' + esc(h.s.note) + '</span>' : '') + '</span></div>').join('') + '</div>' : '<div class="pp-empty">Not logged at any event yet.</div>')
    + '<div class="pp-actions"><button type="button" class="danger" data-action="pp-delete-person">Delete ' + esc(p.name || 'person') + '</button></div>'
    + '</div>';
}

function peoplePageHtml() {
  if (!pDraft) pDraft = newPDraft();
  const p = pPerson && personById(pPerson);
  if (p) return '<div class="pp-page">' + personDetailHtml(p) + '</div>';
  pPerson = null;
  const tabs = { timeline: 'Timeline', lanes: 'Lanes', people: 'People' };
  const body = pui.tab === 'lanes' ? lanesHtml_people() : pui.tab === 'people' ? peopleListHtml() : ppTimelineHtml();
  return '<div class="pp-page"><div class="pp-cols">' + logFormHtml()
    + '<div class="pp-main"><div class="pp-tabs"><span class="seg">' + Object.keys(tabs).map((k) => '<button type="button" data-action="pp-tab" data-tab="' + k + '" class="' + (pui.tab === k ? 'on' : '') + '">' + tabs[k] + '</button>').join('') + '</span>'
    + '<span class="muted">' + pevents.length + ' event' + (pevents.length === 1 ? '' : 's') + ', ' + people.length + ' ' + (people.length === 1 ? 'person' : 'people') + '</span></div>'
    + body + '</div></div></div>';
}

function savePDraft() {
  const d = pDraft;
  if (d.q.trim()) pickHighlighted();
  if (!d.date) return showToast('Pick a day first.', true);
  if (!d.title.trim() && !d.who.length) return showToast('Add an event name or at least one person.', true);
  let e = d.id ? pEventById(d.id) : null;
  if (!e) {
    e = normPEvent({ id: uid(), created: now() });
    pevents.push(e);
  }
  e.date = d.date;
  e.time = d.time;
  e.title = d.title.trim();
  e.updated = now();
  queueUpsert('Events', e);
  const kept = new Set();
  d.who.forEach((w) => {
    let pid = w.personId;
    if (!pid || !personById(pid)) {
      const ex = people.find((p) => p.name.toLowerCase() === w.name.trim().toLowerCase());
      if (ex) pid = ex.id;
      else {
        const p = normPerson({ id: uid(), name: w.name.trim(), created: now(), updated: now() });
        people.push(p);
        queueUpsert('People', p);
        pid = p.id;
      }
    }
    let s = seen.find((x) => x.eventId === e.id && x.personId === pid);
    if (s && kept.has(s.id)) return;
    if (!s) {
      s = normSeen({ id: uid(), eventId: e.id, personId: pid, created: now() });
      seen.push(s);
    }
    const note = String(w.note || '').trim();
    if (s.note !== note || !s.updated) {
      s.note = note;
      s.updated = now();
      queueUpsert('Seen', s);
    }
    kept.add(s.id);
  });
  seen.filter((s) => s.eventId === e.id && !kept.has(s.id)).forEach((s) => queueDelete('Seen', s.id));
  seen = seen.filter((s) => s.eventId !== e.id || kept.has(s.id));
  showToast(d.id ? 'Event updated.' : 'Logged ' + (e.title || dateLabel(e.date)) + (d.who.length ? ' with ' + d.who.length + (d.who.length === 1 ? ' person.' : ' people.') : '.'), true);
  pDraft = newPDraft();
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  render();
}

function editPEvent(id) {
  const e = pEventById(id);
  if (!e) return;
  pDraft = { id: e.id, date: e.date, time: e.time, title: e.title, q: '', hi: 0,
    who: seen.filter((s) => s.eventId === e.id).map((s) => ({ personId: s.personId, name: pName(s.personId), note: s.note })) };
  pPerson = null;
  pPersonEdit = false;
  render();
  const form = document.querySelector('.pp-log');
  if (form) form.scrollIntoView({ block: 'start', behavior: 'smooth' });
}

function deletePEvent(id) {
  const e = pEventById(id);
  if (!e) return;
  if (!confirm('Delete "' + (e.title || 'this event') + '" on ' + dateLabel(e.date, true) + '?')) return;
  seen.filter((s) => s.eventId === id).forEach((s) => queueDelete('Seen', s.id));
  seen = seen.filter((s) => s.eventId !== id);
  pevents = pevents.filter((x) => x.id !== id);
  queueDelete('Events', id);
  pDraft = newPDraft();
  render();
}

function commitPersonName(el, cancel) {
  const p = personById(pPerson);
  pPersonEdit = false;
  const name = el.value.trim().replace(/\s+/g, ' ');
  if (p && !cancel && name && name !== p.name) {
    p.name = name;
    p.updated = now();
    queueUpsert('People', p);
  }
  render();
}

function ppAfterRender() {
  const el = document.querySelector('.pp-lanes');
  if (!el) return;
  if (pLanesScrolled !== pui.range) el.scrollLeft = el.scrollWidth;
  pLanesScrolled = pui.range;
}

function peopleAction(action, el) {
  if (action === 'pp-tab') {
    pui.tab = el.dataset.tab;
    pLanesScrolled = '';
    savePui();
    return render();
  }
  if (action === 'pp-range') {
    pui.range = el.dataset.range;
    savePui();
    return render();
  }
  if (action === 'pp-pick') {
    addWho(el.dataset.id, el.dataset.name);
    pDraft.q = '';
    pDraft.hi = 0;
    pendingFocus = 'pp-q';
    return render();
  }
  if (action === 'pp-who-remove') {
    pDraft.who = pDraft.who.filter((w) => whoKey(w) !== el.dataset.key);
    return render();
  }
  if (action === 'pp-cancel') {
    pDraft = newPDraft();
    return render();
  }
  if (action === 'pp-edit-event') return editPEvent(el.dataset.id);
  if (action === 'pp-delete-event') return deletePEvent(pDraft.id);
  if (action === 'pp-person') {
    pPerson = el.dataset.id;
    pPersonEdit = false;
    window.scrollTo({ top: 0 });
    return render();
  }
  if (action === 'pp-back') {
    pPerson = null;
    pPersonEdit = false;
    return render();
  }
  if (action === 'pp-rename') {
    pPersonEdit = true;
    pendingFocus = 'pp-pname';
    return render();
  }
  if (action === 'pp-log-with') {
    const keepEdit = pDraft && !pDraft.id ? pDraft : newPDraft();
    pDraft = keepEdit;
    addWho(el.dataset.id);
    pPerson = null;
    pendingFocus = 'pp-title';
    window.scrollTo({ top: 0 });
    return render();
  }
  if (action === 'pp-delete-person') {
    const p = personById(pPerson);
    if (!p) return;
    const mine = seen.filter((s) => s.personId === p.id);
    if (!confirm('Delete ' + (p.name || 'this person') + (mine.length ? ' and remove them from ' + mine.length + ' event' + (mine.length === 1 ? '' : 's') : '') + '? The events themselves stay.')) return;
    mine.forEach((s) => queueDelete('Seen', s.id));
    seen = seen.filter((s) => s.personId !== p.id);
    people = people.filter((x) => x !== p);
    queueDelete('People', p.id);
    if (pDraft) pDraft.who = pDraft.who.filter((w) => w.personId !== p.id);
    pPerson = null;
    return render();
  }
}

function peopleInput(el) {
  const k = el.dataset.pp;
  if (k === 'date') pDraft.date = el.value;
  else if (k === 'time') pDraft.time = el.value;
  else if (k === 'title') pDraft.title = el.value;
  else if (k === 'who-note') {
    const w = pDraft.who.find((x) => whoKey(x) === el.dataset.key);
    if (w) w.note = el.value;
  } else if (k === 'q') {
    pDraft.q = el.value;
    pDraft.hi = 0;
    if (/,\s*$/.test(el.value)) {
      pDraft.q = el.value.replace(/,\s*$/, '');
      pickHighlighted();
      pendingFocus = 'pp-q';
      return render();
    }
    refreshSugg();
  } else if (k === 'filter') {
    pFilter = el.value;
    render();
  } else if (k === 'person-note') {
    autosize(el);
    const p = personById(pPerson);
    if (p) p.note = el.value;
  }
}

function peopleChange(el) {
  const k = el.dataset.pp;
  if (k === 'date' || k === 'time') return peopleInput(el);
  if (k === 'sort') {
    pui.sort = el.value;
    savePui();
    return render();
  }
  if (k === 'person-note') {
    const p = personById(pPerson);
    if (!p) return;
    p.note = el.value;
    p.updated = now();
    queueUpsert('People', p);
  }
  if (k === 'person-name' && pPersonEdit) commitPersonName(el, false);
}

function peopleKey(e) {
  const el = e.target;
  const k = el.dataset.pp;
  const enter = e.key === 'Enter' && !e.shiftKey && !e.isComposing;
  if (k === 'q') {
    const n = pSuggestions().length;
    if (e.key === 'ArrowDown' && n) { e.preventDefault(); pDraft.hi = (pDraft.hi + 1) % n; return refreshSugg(); }
    if (e.key === 'ArrowUp' && n) { e.preventDefault(); pDraft.hi = (pDraft.hi - 1 + n) % n; return refreshSugg(); }
    if (e.key === 'Escape') { pDraft.q = ''; el.value = ''; return refreshSugg(); }
    if (e.key === 'Backspace' && !el.value && pDraft.who.length) {
      e.preventDefault();
      pDraft.who.pop();
      pendingFocus = 'pp-q';
      return render();
    }
    if (enter && el.value.trim()) {
      e.preventDefault();
      pickHighlighted();
      pendingFocus = 'pp-q';
      return render();
    }
    return;
  }
  if (k === 'person-name') {
    if (enter) { e.preventDefault(); return commitPersonName(el, false); }
    if (e.key === 'Escape') return commitPersonName(el, true);
    return;
  }
  if (enter && (k === 'title' || k === 'who-note' || k === 'date' || k === 'time')) {
    e.preventDefault();
    const q = document.querySelector('[data-pp="q"]');
    if (q) q.focus();
  }
}

function applyData(data) {
  threads = (data.threads || []).map(normThread);
  items = (data.items || []).map(normItem);
  projects = (data.projects || []).map(normProject);
  lists = (data.lists || []).filter((r) => r.id).map(normList);
  requests = (data.requests || []).map(normRequest);
  sessions = (data.sessions || []).map(normSession).filter((x) => x.sid);
  coordThreads = (data.coordThreads || []).map(normCoordThread).filter((x) => x.slug);
  acks = (data.acks || []).map((a) => ({ requestId: String(a.requestId || ''), status: String(a.status || ''), message: String(a.message || '') }));
  syncInfo = {};
  (data.sync || []).forEach((r) => { if (r.key) syncInfo[String(r.key)] = String(r.value || ''); });
  slackThreads = (data.slackThreads || []).map(normSlackRow).filter((r) => r.key);
  slackSuggestions = (data.slackSuggestions || []).filter((r) => r.key);
  const flagsAt = (data.sync || []).find((r) => r.key === 'lastFlags');
  if (untrackedFlags.at && (!flagsAt || flagsAt.value !== untrackedFlags.at)) untrackedFlags.keys.clear();
  flags = (data.flags || []).filter((r) => r.key && !untrackedFlags.keys.has(String(r.key))).map(normFlag);
  prRows = (data.prs || []).filter((r) => r.key).map(normPr);
  focusBlocks = (data.focus || []).filter((r) => r.id).map(normFocus);
  docs = (data.docs || []).filter((r) => r.key).map(normDoc);
  imports = (data.imports || []).filter((r) => r.id);
  people = (data.people || []).filter((r) => r.id).map(normPerson);
  pevents = (data.events || []).filter((r) => r.id).map(normPEvent);
  seen = (data.seen || []).filter((r) => r.id).map(normSeen);
  slackCaptures = (data.slackCaptures || []).filter((r) => r.key).map((r) => ({ key: String(r.key), threadKey: String(r.threadKey || ''), permalink: String(r.permalink || ''), author: String(r.author || ''), text: String(r.text || ''), capturedAt: String(r.capturedAt || '') }));
  slackSummaries = (data.slackSummaries || []).filter((r) => r.key).map((r) => ({ key: r.key, summary: String(r.summary || ''), decisions: jsonList(r.decisions), questions: jsonList(r.questions), at: r.at || '' }));
  overlayPending();
  if (data.sheetUrl) {
    const a = document.getElementById('sheetLink');
    a.href = data.sheetUrl;
    a.style.display = '';
  }
}

async function load(quiet) {
  if (loading) return;
  loading = true;
  lastAttempt = Date.now();
  const wasOffline = offline;
  if (!quiet) setSync();
  let fresh = false;
  try {
    const data = await withTimeout(api.load(), 20000);
    const sig = JSON.stringify([data.threads, data.items, data.projects, data.lists, data.requests, data.sessions, data.coordThreads, data.acks, data.sync, data.slackThreads, data.slackSuggestions, data.slackSummaries, data.slackCaptures, data.flags, data.prs, data.focus, data.docs, data.imports, data.edits, data.people, data.events, data.seen]);
    if (!quiet || sig !== lastSig || wasOffline) {
      applyData({ threads: data.threads, items: data.items, projects: data.projects, lists: data.lists, requests: data.requests, sessions: data.sessions, coordThreads: data.coordThreads, acks: data.acks, sync: data.sync, slackThreads: data.slackThreads, slackSuggestions: data.slackSuggestions, slackSummaries: data.slackSummaries, slackCaptures: data.slackCaptures, flags: data.flags, prs: data.prs, focus: data.focus, docs: data.docs, imports: data.imports, people: data.people, events: data.events, seen: data.seen, sheetUrl: data.meta && data.meta.sheetUrl });
      applyEdits(data.edits || []);
      saveCache();
      fresh = true;
    }
    lastSig = sig;
    lastLoad = Date.now();
    pruneRequests();
    offline = false;
    failed = false;
    cachedAt = '';
    if (pending.size) scheduleFlush(0);
  } catch (err) {
    console.error(err);
    offline = true;
  }
  loading = false;
  setSync();
  if (fresh || offline !== wasOffline) render();
}

const headerEl = document.querySelector('header');
new ResizeObserver(() => document.documentElement.style.setProperty('--head', headerEl.offsetHeight + 'px')).observe(headerEl);

restorePending();
const cache = storeGet(CACHE_KEY);
if (cache) {
  cachedAt = cache.at;
  applyData(cache);
  render();
}
load();
</script>

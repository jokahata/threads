<script>
const JIRA_BROWSE = '';

  { id: 'left', label: 'Ongoing', sections: ['ongoing'], drop: 'ongoing', collapsible: true },

];
const COLHEAD = '<div class="grid colhead"><span></span><span></span><span>Thread</span><span>Status</span><span>Progress</span><span class="next">Next</span><span class="latest">Latest note</span><span class="updated">Updated</span></div>';

  load: () => new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej).loadAll()),
  apply: (ops) => new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej).applyOps(ops)),
  logFocus: (block, rows) => new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej).logFocus(block, rows)),

  async load() {

  },
  async apply(ops) {
    if (window.mockOffline) throw new Error('offline');
    const db = JSON.parse(localStorage.getItem('threads-db') || '{"threads":[],"items":[]}');
    ops.forEach((op) => {
      const key = { Threads: 'threads', Items: 'items', Projects: 'projects', Requests: 'requests', Focus: 'focus', Lists: 'lists', People: 'people', Events: 'events', Seen: 'seen' }[op.table];
      const list = db[key] = db[key] || [];
      const id = op.type === 'delete' ? op.id : op.record.id;
      const i = list.findIndex((r) => r.id === id);
      if (op.type === 'delete') { if (i >= 0) list.splice(i, 1); }

  },
  async getDoc(key) {
    if (window.mockOffline) throw new Error('offline');

    return (db.docText || []).filter((r) => r.key === key).sort((a, b) => a.part - b.part).map((r) => r.text).join('');
  },
  async logFocus(block, rows) {
    if (window.mockOffline || window.mockLogFail) throw new Error('offline');
    const db = JSON.parse(localStorage.getItem('threads-db') || '{"threads":[],"items":[]}');
    const list = db.focus = db.focus || [];
    const cur = list.find((r) => r.id === block.id);

const ui = loadUi();
let threads = [];
let projects = [];
let lists = [];
let people = [];
let pevents = [];
let seen = [];
let requests = [];
let sessions = [];
let coordThreads = [];
let acks = [];
let syncInfo = {};
let slackThreads = [];
let slackSuggestions = [];
let slackSummaries = [];
let slackCaptures = [];
let flags = [];
const untrackedFlags = { keys: new Set(), at: '' };
let prRows = [];
let focusBlocks = [];
let docs = [];
let imports = [];
const boardImportParent = {};
const jobs = {};
const summarizing = {};
let summaryOpen = null;
let editingProject = null;
let projectDraft = null;
let items = [];
let editingThread = null;
let editingItem = null;
let editDraft = null;
let pendingFocus = null;
let rendering = false;
let lastLoad = 0;
let drag = null;
let dropMark = null;

function loadUi() {
  try {
    const s = JSON.parse(localStorage.getItem('threads-ui') || '{}');
    return { filter: s.filter || 'open', expanded: new Set(s.expanded || []), collapsedSections: new Set(s.collapsedSections || []), timelineOpen: s.timelineOpen !== false, flagsOpen: s.flagsOpen !== false, flagsShowAll: !!s.flagsShowAll, prsOpen: s.prsOpen !== false, prsShowDone: !!s.prsShowDone, reviewShowDone: !!s.reviewShowDone, docsOpen: !!s.docsOpen, scratchOpen: s.scratchOpen !== false, scratchShowDone: !!s.scratchShowDone, pinOpen: s.pinOpen || '', boards: new Set(s.boards || []), dismissedImports: new Set(s.dismissedImports || []), inboxOpen: s.inboxOpen !== false, collapsedLanes: new Set(s.collapsedLanes || []), collapsedProjects: new Set(s.collapsedProjects || []), projectShowDone: new Set(s.projectShowDone || []) };
  } catch (e) {
    return { filter: 'open', expanded: new Set(), collapsedSections: new Set(), timelineOpen: true, collapsedLanes: new Set(), collapsedProjects: new Set(), projectShowDone: new Set() };
  }
}

function saveUi() {
  try {
    localStorage.setItem('threads-ui', JSON.stringify({ filter: ui.filter, expanded: [...ui.expanded], collapsedSections: [...ui.collapsedSections], timelineOpen: ui.timelineOpen, flagsOpen: ui.flagsOpen, flagsShowAll: ui.flagsShowAll, prsOpen: ui.prsOpen, prsShowDone: ui.prsShowDone, reviewShowDone: ui.reviewShowDone, docsOpen: ui.docsOpen, scratchOpen: ui.scratchOpen, scratchShowDone: ui.scratchShowDone, pinOpen: ui.pinOpen, boards: [...ui.boards], dismissedImports: [...ui.dismissedImports], inboxOpen: ui.inboxOpen, collapsedLanes: [...ui.collapsedLanes], collapsedProjects: [...ui.collapsedProjects], projectShowDone: [...ui.projectShowDone] }));
  } catch (e) {}
}

const now = () => new Date().toISOString();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (v, d) => (v === '' || v == null || isNaN(Number(v)) ? d : Number(v));

function normThread(r) {
  return {
    id: String(r.id), title: String(r.title || ''),
    status: STATUSES.includes(r.status) ? r.status : 'active',
    position: num(r.position, 0), created: r.created || '', updated: r.updated || r.created || '',
    section: SECTION_IDS.includes(r.section) ? r.section : 'now',
    start: ymdOf(r.start), due: ymdOf(r.due), dim: isTrue(r.dim), star: isTrue(r.star), project: String(r.project || ''), slug: String(r.slug || ''),
    after: String(r.after || '').split(',').map((x) => x.trim()).filter(Boolean), pin: isTrue(r.pin),
  };

function normItem(r) {
  return {

    kind: KINDS[r.kind] || r.kind === 'link' || r.kind === 'scratch' || r.kind === 'entry' ? r.kind : 'note', text: String(r.text || ''),
    done: isTrue(r.done),
    link: String(r.link || ''),
    refs: String(r.refs || '').split(',').map((s) => s.trim()).filter(Boolean),
    position: num(r.position, 0), created: r.created || '', updated: r.updated || r.created || '',
    due: ymdOf(r.due),

function normRequest(r) {
  return { id: String(r.id), kind: String(r.kind || ''), target: String(r.target || ''), created: r.created || '', updated: r.updated || '' };
}

function normSession(r) {
  return {
    sid: String(r.sid || ''), id: String(r.id || '').slice(0, 8), name: String(r.name || ''), label: String(r.label || r.name || ''),
    state: String(r.state || 'gone'), activity: String(r.activity || ''), tab: isTrue(r.tab), need: isTrue(r.need),
    summary: String(r.summary || ''), thread: String(r.thread || ''), prs: String(r.prs || ''), cwd: String(r.cwd || ''), earlier: isTrue(r.earlier),
  };
}

function jsonList(v) {
  if (Array.isArray(v)) return v.map(String);
  try {
    const x = JSON.parse(v || '[]');
    return Array.isArray(x) ? x.map(String) : [];
  } catch (e) {
    return [];
  }
}

function normSlackRow(r) {
  let recent = [];
  try {
    recent = Array.isArray(r.recent) ? r.recent : JSON.parse(r.recent || '[]');
  } catch (e) {
    recent = [];
  }
  return {
    key: String(r.key || ''), channel: String(r.channel || ''), ts: String(r.ts || ''), parentBy: String(r.parentBy || ''), parentText: String(r.parentText || ''),
    replyCount: num(r.replyCount, 0), newestTs: String(r.newestTs || ''), newestBy: String(r.newestBy || ''), myLastTs: String(r.myLastTs || ''),
    recent: Array.isArray(recent) ? recent : [], checkedAt: String(r.checkedAt || ''), error: String(r.error || ''),
  };
}

function normCoordThread(r) {
  return { slug: String(r.slug || ''), title: String(r.title || ''), aliases: String(r.aliases || ''), live: num(r.live, 0), need: isTrue(r.need) };
}

function parseMeta(v) {
  if (v && typeof v === 'object') return v;
  try {
    const o = JSON.parse(v || '{}');
    return o && typeof o === 'object' ? o : {};
  } catch (e) {
    return {};
  }

  return {
    id: String(r.id), name: String(r.name || ''),
    color: /^#[0-9a-fA-F]{6}$/.test(String(r.color || '')) ? String(r.color) : PALETTE[0],
    parent: String(r.parent || ''), slug: String(r.slug || ''), import: String(r.import || ''),
    position: num(r.position, 0), created: r.created || '', updated: r.updated || r.created || '',

function isTrue(v) { return v === true || String(v).toUpperCase() === 'TRUE'; }
function ymdOf(v) { const m = String(v || '').match(/^(\d{4}-\d{2}-\d{2})/); return m ? m[1] : ''; }
const pad2 = (n) => (n < 10 ? '0' : '') + n;
function ymd(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function parseYmd(v) { const p = v.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }

function fmtDay(v) { return parseYmd(v).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); }
function isOverdue(due, done) { return !!due && !done && due < todayYmd(); }

const pending = new Map();
const PENDING_KEY = 'threads-pending';
const CACHE_KEY = 'threads-cache';
let flushTimer = null;
let cacheTimer = null;
let inFlight = null;
let failed = false;
let offline = false;
let durable = true;
let loading = false;
let cachedAt = '';

function opKey(op) { return op.table + ':' + (op.type === 'delete' ? op.id : op.record.id); }

function queueUpsert(table, rec) {
  const record = Object.assign({}, rec);
  Object.keys(record).forEach((k) => { if (Array.isArray(record[k])) record[k] = record[k].join(','); });
  Object.keys(record).forEach((k) => { if (typeof record[k] === 'boolean') record[k] = record[k] ? 'TRUE' : 'FALSE'; });
  if (record.meta && typeof record.meta === 'object') record.meta = JSON.stringify(record.meta);
  pending.set(table + ':' + rec.id, { type: 'upsert', table, record });
  changed();
}

function queueDelete(table, id) {
  pending.set(table + ':' + id, { type: 'delete', table, id });
  changed();
}

function changed() {
  persistPending();
  clearTimeout(cacheTimer);
  cacheTimer = setTimeout(saveCache, 500);
  scheduleFlush(400);
}

function saveThread(t) { t.updated = now(); queueUpsert('Threads', Object.assign({}, t, { after: (t.after || []).join(',') })); }
function saveItem(i) { i.updated = now(); queueUpsert('Items', i); }

function storeSet(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
    return true;
  } catch (e) {
    return false;
  }
}

function storeGet(key) {
  try {
    return JSON.parse(localStorage.getItem(key) || 'null');
  } catch (e) {
    return null;
  }
}

function persistPending() {
  durable = storeSet(PENDING_KEY, (inFlight || []).concat([...pending.values()]));
}

function saveCache() {
  const sheetLink = document.getElementById('sheetLink');
  storeSet(CACHE_KEY, { at: now(), threads, items, projects, lists: lists.map((l) => Object.assign({}, l, { meta: JSON.stringify(l.meta) })), requests, sessions, coordThreads, acks, sync: Object.keys(syncInfo).map((k) => ({ key: k, value: syncInfo[k] })), slackThreads: slackThreads.map((r) => Object.assign({}, r, { recent: JSON.stringify(r.recent) })), slackSuggestions, slackCaptures, slackSummaries: slackSummaries.map((r) => Object.assign({}, r, { decisions: JSON.stringify(r.decisions), questions: JSON.stringify(r.questions) })), flags: flags.map((f) => f.raw), prs: prRows.map((r) => r.raw), focus: focusBlocks.map(focusRecord), docs: docs.map((d) => d.raw), imports, people, events: pevents, seen, sheetUrl: sheetLink.style.display === 'none' ? '' : sheetLink.href });
}

function restorePending() {
  (storeGet(PENDING_KEY) || []).forEach((op) => { if (!pending.has(opKey(op))) pending.set(opKey(op), op); });
}

function overlayPending() {
  (inFlight || []).concat([...pending.values()]).forEach((op) => {
    const tables = { Threads: [threads, normThread], Items: [items, normItem], Requests: [requests, normRequest], Projects: [projects, normProject], Focus: [focusBlocks, normFocus], Lists: [lists, normList], People: [people, normPerson], Events: [pevents, normPEvent], Seen: [seen, normSeen] };
    if (!tables[op.table]) return;
    const [list, norm] = tables[op.table];
    const id = op.type === 'delete' ? op.id : String(op.record.id);
    const idx = list.findIndex((r) => r.id === id);
    if (op.type === 'delete') {
      if (idx >= 0) list.splice(idx, 1);
      return;
    }
    const rec = norm(op.record);
    if (idx >= 0) list[idx] = rec;
    else list.push(rec);
  });
}

function scheduleFlush(ms) {
  setSync();
  clearTimeout(flushTimer);
  flushTimer = setTimeout(flush, ms);
}

function withTimeout(promise, ms) {
  return Promise.race([promise, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
}

async function flush() {
  if (inFlight) return scheduleFlush(300);
  if (!pending.size) return setSync();
  const ops = [...pending.values()];
  pending.clear();
  inFlight = ops;
  persistPending();
  let ok = false;
  try {
    await withTimeout(api.apply(ops), 30000);
    ok = true;
  } catch (err) {
    ops.forEach((op) => { if (!pending.has(opKey(op))) pending.set(opKey(op), op); });
    console.error(err);
  }
  inFlight = null;
  persistPending();
  failed = !ok;
  const wasOffline = offline;
  if (ok) offline = false;
  if (pending.size) scheduleFlush(ok ? 300 : 5000);
  else setSync();
  if (ok && wasOffline && !pending.size) load();
}

function setSync() {
  const el = document.getElementById('sync');
  const n = pending.size + (inFlight ? inFlight.length : 0);
  let text;
  if (loading && !threads.length) text = 'Loading...';
  else if (offline || failed) text = n ? 'Offline, ' + n + ' waiting' : 'Offline';
  else if (n) text = 'Saving...';
  else text = loading ? 'Refreshing...' : 'Saved';
  el.className = offline || failed ? 'error' : '';
  el.textContent = text;
  el.title = offline || failed ? (n ? n + ' change' + (n === 1 ? '' : 's') + ' saved on this device, will sync when back online. ' : 'Showing the copy saved on this device. ') + (cachedAt ? 'Last synced ' + stamp(cachedAt) + '.' : '') : '';
}

function threadById(id) { return threads.find((t) => t.id === id); }
function itemById(id) { return items.find((i) => i.id === id); }

function itemsOf(threadId, kind) {
  return items.filter((i) => i.threadId === threadId && i.kind === kind).sort((a, b) => a.position - b.position);
}

function sortedThreads() {
  return threads.slice().sort((a, b) => SECTION_IDS.indexOf(a.section) - SECTION_IDS.indexOf(b.section) || (b.star - a.star) || a.position - b.position);
}

function lastTouched(t) {
  return items.reduce((m, i) => (i.threadId === t.id && i.updated > m ? i.updated : m), t.updated || '');
}

function projectById(id) { return projects.find((p) => p.id === id); }
function sortedProjects() { return projects.slice().sort((a, b) => a.position - b.position); }

function viewProjectId() {
  const m = location.hash.match(/^#project=([\w-]+)$/);
  return m && projectById(m[1]) ? m[1] : '';
}

function visibleThreads() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const pid = viewProjectId();
  const tree = pid ? subtreeIds(pid) : null;
  return sortedThreads().filter((t) => {
    if (tree && !tree.has(t.project)) return false;
    if (ui.filter === 'open' && t.status === 'done') return false;
    if (ui.filter !== 'open' && ui.filter !== 'all' && t.status !== ui.filter) return false;
    if (!q) return true;
    if (t.title.toLowerCase().includes(q)) return true;
    const proj = projectById(t.project);
    if (proj && proj.name.toLowerCase().includes(q)) return true;
    return items.some((i) => i.threadId === t.id && (i.text + ' ' + i.link + ' ' + i.title).toLowerCase().includes(q));
  });
}

function ago(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const s = (Date.now() - d.getTime()) / 1000;
  if (s < 60) return 'now';
  if (s < 3600) return Math.floor(s / 60) + 'm';
  if (s < 86400) return Math.floor(s / 3600) + 'h';
  if (s < 86400 * 14) return Math.floor(s / 86400) + 'd';
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

function stamp(iso) {
  const d = new Date(iso);
  if (!iso || isNaN(d)) return '';
  return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}

function shortUrl(url) {
  let m = url.match(/\/pull\/(\d+)/);
  if (m) return 'PR ' + m[1];
  m = url.match(/\/browse\/([A-Z][A-Z0-9]+-\d+)/);
  if (m) return m[1];
  if (/docs\.google\.com\/document/.test(url)) return 'Doc';
  if (/docs\.google\.com\/spreadsheets/.test(url)) return 'Sheet';
  if (/docs\.google\.com\/presentation/.test(url)) return 'Slides';
  if (/slack\.com/.test(url)) return 'Slack';
  try {
    const u = new URL(url);
    const path = u.pathname.length > 1 ? u.pathname.slice(0, 18) + (u.pathname.length > 18 ? '...' : '') : '';
    return u.hostname.replace(/^www\./, '') + path;
  } catch (e) {
    return url.slice(0, 30);
  }
}

function linkify(text) {
  return esc(text).replace(/(https?:\/\/[^\s<]+)|(?<![\w./-])((?:[\w.-]+\/[\w.-]+)|[a-z][\w-]*)#(\d+)(?:-#?(\d+))?|\b([A-Z][A-Z0-9]{1,9}-\d+)\b/g, (m, url, repo, n1, n2, key) => {
    if (repo) {
      const full = repo.includes('/') ? repo : REPO_SHORT[repo];
      if (!full || !GIT_HOST) return m;
      const a = (n, label) => '<a href="' + GIT_HOST + '/' + full + '/pull/' + n + '" target="_blank" rel="noopener" title="' + full + '#' + n + '">' + label + '</a>';
      return a(n1, repo + '#' + n1) + (n2 ? '-' + a(n2, '#' + n2) : '');
    }
    if (url) return '<a href="' + url + '" target="_blank" rel="noopener">' + esc(shortUrl(url.replace(/&amp;/g, '&'))) + '</a>';
    if (!JIRA_BROWSE) return key;
    return '<a href="' + JIRA_BROWSE + key + '" target="_blank" rel="noopener">' + key + '</a>';
  });
}

function firstLine(s) { return String(s).split('\n')[0]; }

function render() {
  const keep = {};
  document.querySelectorAll('input[data-focus], textarea[data-focus]').forEach((el) => { if (el.type !== 'checkbox' && !el.dataset.pp && el.value !== el.defaultValue) keep[el.dataset.focus] = el.value; });

  let sel = null;
  if (!focusKey && active && active.dataset && active.dataset.focus) {
    focusKey = active.dataset.focus;

  }

function autosize(el) {

function timelineHtml(list) {
  const today = todayYmd();
  const firstDate = (r) => r.t.due || r.subs[0].due;
  const rows = list.map((t) => ({ t, subs: itemsOf(t.id, 'task').filter((i) => i.due).sort((a, b) => (a.due < b.due ? -1 : a.due > b.due ? 1 : 0)) }))
    .filter((r) => r.t.due || r.subs.length)
    .sort((a, b) => (firstDate(a) < firstDate(b) ? -1 : firstDate(a) > firstDate(b) ? 1 : 0));
  const head = '<div class="tl-head" data-action="toggle-timeline"><span class="caret"></span><span>Timeline</span><span class="count">' + rows.length + '</span>'
    + '<span class="hint">Drag a thread or subtask onto a day to set its date</span></div>';
  if (!ui.timelineOpen) return head;
  const dates = [today];
  rows.forEach((r) => {
    if (r.t.start) dates.push(r.t.start);
    if (r.t.due) dates.push(r.t.due);
    r.subs.forEach((i) => dates.push(i.due));
  });
  const lo = dates.reduce((m, d) => (d < m ? d : m));
  const hi = dates.reduce((m, d) => (d > m ? d : m));
  const start = lo < addDays(today, -7) ? addDays(lo, -2) : addDays(today, -7);
  const end = hi > addDays(today, 49) ? addDays(hi, 14) : addDays(today, 63);
  const n = dayDiff(start, end) + 1;
  let cols = '';
  let cells = '';
  for (let k = 0; k < n; k++) {
    const d = parseYmd(addDays(start, k));
    const cls = (d.getDay() === 0 || d.getDay() === 6 ? ' we' : '') + (k && d.getDate() === 1 ? ' ms' : '') + (ymd(d) === today ? ' today' : '');
    cols += '<i class="' + cls + '"></i>';
    cells += '<div class="tl-day' + cls + '">'
      + (k === 0 || d.getDate() === 1 ? '<b>' + d.toLocaleDateString(undefined, { month: 'short' }) + '</b>' : '<b></b>')
      + '<span>' + 'SMTWTFS'[d.getDay()] + '</span><span class="dn">' + d.getDate() + '</span></div>';
  }
  const body = rows.map((r) => {
    const t = r.t;
    const over = isOverdue(t.due, t.status === 'done');
    const from = t.due ? (t.start && t.start <= t.due ? t.start : t.due) : '';
    const bar = t.due
      ? '<div class="tl-bar s-' + t.status + (over ? ' overdue' : '') + '" draggable="true" data-drag="thread" data-id="' + t.id + '" data-goto="' + t.id + '"'
        + ' style="--i:' + dayDiff(start, from) + ';--n:' + (dayDiff(from, t.due) + 1) + '" title="' + esc(t.title || 'Untitled') + ': ' + fmtDay(from) + ' - ' + fmtDay(t.due) + '"><span>' + esc(t.title || 'Untitled') + '</span></div>'
      : '';
    return '<div class="tl-row' + (t.dim ? ' dimmed' : '') + '" data-tl-thread="' + t.id + '">'
      + '<div class="tl-label" data-goto="' + t.id + '" title="' + esc(t.title || 'Untitled') + '"><span class="tl-name">' + esc(t.title || 'Untitled') + '</span>'
      + (t.due ? '<span class="tl-due' + (over ? ' overdue' : '') + '">' + fmtDay(t.due) + '</span>' : '') + '</div>'
      + '<div class="tl-track">' + bar + '</div></div>'
      + r.subs.map((i) => '<div class="tl-row sub' + (t.dim ? ' dimmed' : '') + '">'
        + '<div class="tl-label sub' + (i.done ? ' done' : '') + '" data-goto="' + t.id + '" title="' + esc(i.text) + '"><span class="tl-name">' + esc(firstLine(i.text)) + '</span></div>'
        + '<div class="tl-track"><span class="tl-marker' + (i.done ? ' done' : '') + (isOverdue(i.due, i.done) ? ' overdue' : '') + '" draggable="true" data-drag="item" data-id="' + i.id + '" data-tl-item="' + i.id + '"'
        + ' style="--i:' + dayDiff(start, i.due) + '" title="' + esc(firstLine(i.text)) + ': ' + fmtDay(i.due) + '"></span>'
        + '<span class="tl-mlabel" style="--i:' + dayDiff(start, i.due) + '">' + fmtDay(i.due) + '</span></div></div>').join('');
  }).join('');
  return head + '<div class="tl-scroll"><div class="tl-grid" data-start="' + start + '" data-days="' + n + '" style="--days:' + n + '">'
    + '<div class="tl-cols">' + cols + '</div>'
    + '<div class="tl-row tl-daysrow"><div class="tl-label tl-corner"></div><div class="tl-track">' + cells + '</div></div>'
    + (body || '<div class="tl-row tl-empty"><div class="tl-label"></div><div class="tl-track"><span>Nothing scheduled yet. Drag a thread or subtask onto a day.</span></div></div>')
    + '<div class="tl-hover"><span></span></div>'
    + '</div></div>';
}

function renderTimeline(list) {
  const box = document.getElementById('timeline');

  box.className = ui.timelineOpen ? 'open' : '';
  box.innerHTML = timelineHtml(list);
  const sc = box.querySelector('.tl-scroll');
  const grid = box.querySelector('.tl-grid');
  if (!sc || !grid) return;
  const dw = parseFloat(getComputedStyle(box).getPropertyValue('--dw')) || 32;
  sc.scrollTop = prev ? prev.top : 0;
  sc.scrollLeft = prev ? prev.left + dayDiff(grid.dataset.start, prev.start) * dw : Math.max(0, (dayDiff(grid.dataset.start, todayYmd()) - 3) * dw);
}

const PENCIL = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 2.5l2.5 2.5L5.5 13H3v-2.5z"/><path d="M9.5 4l2.5 2.5"/></svg>';

function childProjects(pid) {
  return sortedProjects().filter((p) => (pid ? p.parent === pid : !p.parent || !projectById(p.parent)));
}

function subtreeIds(pid) {
  const out = new Set([pid]);
  const walk = (id) => childProjects(id).forEach((c) => {
    if (!out.has(c.id)) {
      out.add(c.id);
      walk(c.id);
    }
  });
  walk(pid);
  return out;
}

function projectPath(p, from) {
  const names = [];
  const seen = new Set();
  let cur = p;
  while (cur && !seen.has(cur.id) && cur.id !== from) {
    seen.add(cur.id);
    names.unshift(cur.name || 'Untitled');
    cur = projectById(cur.parent);
  }
  return names.join(' > ');
}

function projectTreeOrder() {
  const order = [];
  const seen = new Set();
  const walk = (pid, depth) => childProjects(pid).forEach((p) => {
    if (seen.has(p.id)) return;
    seen.add(p.id);
    order.push({ p, depth });
    walk(p.id, depth + 1);
  });
  walk('', 0);
  return order;
}

function normalizeSlug(v) {
  return String(v || '').toLowerCase().trim().replace(/[^a-z0-9-]+/g, '-').replace(/^-+|-+$/g, '');
}

function slugOwner(slug, selfId) {
  if (!slug) return null;
  return projects.find((p) => p.slug === slug && p.id !== selfId) || threads.find((t) => t.slug === slug && t.id !== selfId) || null;
}

function projectThreads(pid) {

    + '</select></label>'

function projectCardHtml(p, depth) {
  const tree = subtreeIds(p.id);

  const doneN = all.filter((t) => t.status === 'done').length;
  const own = projectThreads(p.id);
  const ownDone = own.filter((t) => t.status === 'done');
  const ownActive = own.filter((t) => t.status !== 'done');
  const kids = childProjects(p.id);
  const open = !ui.collapsedProjects.has(p.id);
  const showDone = ui.projectShowDone.has(p.id);
  const head = editingProject === p.id
    ? projectFormHtml(p)

      + '<button class="popen" data-action="open-project" data-project="' + p.id + '">Open</button>'

  const rows = ownActive.concat(showDone ? ownDone : []).map(projectRowHtml).join('');
  return '<div class="project' + (open ? ' open' : '') + (depth ? ' sub' : '') + '" data-project="' + p.id + '" style="--pc:' + p.color + '">'

      + (own.length || kids.length ? '' : '<div class="project-empty">Drag threads here to add them.</div>')
      + '</div>' : '')
    + '</div>';
}

function projectRowHtml(t) {
  const latest = items.filter((i) => i.threadId === t.id && i.kind === 'note').sort((a, b) => (a.created < b.created ? 1 : -1))[0];
  const sec = SECTIONS.find((x) => x.id === t.section);
  return '<div class="prow' + (t.status === 'done' ? ' done' : '') + (t.dim ? ' dimmed' : '') + '" data-goto="' + t.id + '" data-prow="' + t.id + '">'
    + '<span class="grip" draggable="true" data-drag="thread" data-id="' + t.id + '" title="Drag to move or re-tag"></span>'
    + '<span class="sdot s-' + t.status + '" title="' + t.status + '"></span>'
    + '<span class="prow-title" title="' + esc(t.title) + '">' + (t.star ? '<span class="pstar">&#9733;</span>' : '') + esc(t.title || 'Untitled') + '</span>'
    + '<span class="prow-sec">' + (sec ? sec.label : '') + '</span>'
    + '<span class="prow-latest">' + (latest ? esc(firstLine(latest.text)) : '') + '</span>'
    + '<button class="x" data-action="unassign-project" data-thread="' + t.id + '" title="Remove from project">x</button>'
    + '</div>';
}

function projectBannerHtml(list) {
  const pid = viewProjectId();
  if (!pid) return '';
  const p = projectById(pid);
  const tree = subtreeIds(pid);
  const all = threads.filter((t) => tree.has(t.project));
  const parent = projectById(p.parent);
  return '<div class="project-banner" style="--pc:' + p.color + '">'
    + '<button data-action="close-project">&larr; All threads</button>'
    + (parent ? '<button class="pcrumb" data-action="open-project" data-project="' + parent.id + '">' + esc(projectPath(parent)) + ' &gt;</button>' : '')
    + '<span class="pdot"></span><span class="pname">' + esc(p.name || 'Untitled project') + '</span>'
    + (p.slug ? '<span class="pslug">#' + esc(p.slug) + '</span>' : '')
    + '<span class="pcount">' + all.filter((t) => t.status !== 'done').length + ' active, ' + all.filter((t) => t.status === 'done').length + ' done</span>'
    + '<span class="spacer"></span><span class="muted">New threads you add here join this project.</span>'
    + '<span class="seg"><button data-action="board-view" data-mode="list" class="' + (ui.boards.has(pid) ? '' : 'on') + '">List</button><button data-action="board-view" data-mode="board" class="' + (ui.boards.has(pid) ? 'on' : '') + '">Board</button></span>'
    + '</div>'
    + '<div class="banner-links">' + linkStripHtml(projectLinks(pid), 'project:' + pid, autoSessions(p.slug)) + '</div>';
}

function newProject() {
  const used = new Set(projects.map((p) => p.color));
  const top = childProjects('');
  const p = { id: uid(), name: '', color: PALETTE.find((c) => !used.has(c)) || PALETTE[projects.length % PALETTE.length], position: top.reduce((m, x) => Math.min(m, x.position), 1) - 1, created: '', updated: '', parent: '', slug: '' };
  projects.push(p);
  ui.collapsedLanes.delete('left');
  saveUi();
  editingProject = p.id;
  projectDraft = { name: '', color: p.color, slug: '', parent: '', error: '' };
  pendingFocus = 'pname:' + p.id;
  render();
}

function startEditProject(id) {
  const p = projectById(id);
  editingProject = id;
  projectDraft = { name: p.name, color: p.color, slug: p.slug, parent: p.parent, error: '' };
  pendingFocus = 'pname:' + id;
  render();
}

function readProjectForm() {
  const form = document.querySelector('[data-project-form]');
  if (!form || !projectDraft) return;
  projectDraft.name = form.querySelector('.pname-input').value;
  projectDraft.slug = form.querySelector('.pslug-input').value;
  projectDraft.parent = form.querySelector('.pparent-select').value;
}

function commitProject(cancel) {
  const p = projectById(editingProject);
  const d = projectDraft;
  if (!p) {
    editingProject = null;
    projectDraft = null;
    return render();
  }
  if (cancel || !d.name.trim()) {
    editingProject = null;
    projectDraft = null;
    if (!p.created) projects = projects.filter((x) => x !== p);
    return render();
  }
  const slug = normalizeSlug(d.slug);
  const owner = slugOwner(slug, p.id);
  if (owner) {
    d.error = 'Slug #' + slug + ' is already used by "' + (owner.name || owner.title) + '".';
    pendingFocus = 'pname:' + p.id;
    return render();
  }
  editingProject = null;
  projectDraft = null;
  const parentChanged = (p.parent || '') !== (d.parent || '');
  p.name = d.name.trim();
  p.color = d.color;
  p.slug = slug;
  if (parentChanged && !(p.created && subtreeIds(p.id).has(d.parent))) {
    p.parent = d.parent || '';
    p.position = childProjects(p.parent).filter((x) => x !== p).reduce((m, x) => Math.max(m, x.position), -1) + 1;
    if (p.parent) ui.collapsedProjects.delete(p.parent);
    saveUi();
  }
  if (!p.created) p.created = now();
  saveProject(p);
  render();
}

function saveProject(p) { p.updated = now(); queueUpsert('Projects', p); }

function deleteProject(id) {
  const p = projectById(id);
  if (!p) return;
  const parent = projectById(p.parent);
  const where = parent ? 'move up to "' + parent.name + '"' : 'stay where they are, just untagged';
  if (!confirm('Delete project "' + p.name + '"? Its threads and sub-projects ' + where + '.')) return;
  editingProject = null;
  projectDraft = null;
  threads.filter((t) => t.project === id).forEach((t) => { t.project = p.parent || ''; saveThread(t); });
  items.filter((i) => i.kind === 'link' && !i.threadId && i.projectId === id).forEach((i) => { i.projectId = p.parent || ''; saveItem(i); });
  childProjects(id).forEach((c) => { c.parent = p.parent || ''; saveProject(c); });
  projects = projects.filter((x) => x !== p);
  queueDelete('Projects', id);
  if (viewProjectId() === id) history.replaceState(null, '', location.pathname + location.search);
  render();
}

function setThreadProject(tid, pid) {
  const t = threadById(tid);
  if (!t || t.project === pid) return render();
  t.project = pid;
  saveThread(t);
  if (pid) ui.collapsedProjects.delete(pid);
  saveUi();
  render();
}

function setThreadSlug(tid, value) {
  const t = threadById(tid);
  if (!t) return;
  const slug = normalizeSlug(value);
  const owner = slugOwner(slug, t.id);
  if (owner) {
    showToast('Slug #' + slug + ' is already used by "' + (owner.name || owner.title) + '"', true);
    return render();
  }
  if (slug !== t.slug) {
    t.slug = slug;
    saveThread(t);
  }
  render();
}

function moveProject(id, targetId, before) {
  const p = projectById(id);
  const target = projectById(targetId);
  if (!p || !target || subtreeIds(p.id).has(target.id)) return;
  p.parent = target.parent && projectById(target.parent) ? target.parent : '';
  const order = childProjects(p.parent).filter((x) => x !== p);
  let idx = order.indexOf(target);
  if (!before) idx += 1;
  order.splice(idx, 0, p);
  renumber(order, (r) => (r === p ? null : queueUpsert('Projects', r)));
  saveProject(p);
  render();
}

function nestProject(id, parentId) {
  const p = projectById(id);
  if (!p || (parentId && subtreeIds(p.id).has(parentId))) return;
  p.parent = parentId || '';
  p.position = childProjects(p.parent).filter((x) => x !== p).reduce((m, x) => Math.max(m, x.position), -1) + 1;
  saveProject(p);
  if (parentId) ui.collapsedProjects.delete(parentId);
  saveUi();
  render();
}

function openProject(id) {
  location.hash = 'project=' + id;
}

function groupedRowsHtml(list) {
  const pid = viewProjectId();
  if (!pid) return list.map(threadHtml).join('');
  const order = new Map(projectTreeOrder().map((x, i) => [x.p.id, i]));
  const sorted = list.slice().sort((a, b) => (order.get(a.project) ?? -1) - (order.get(b.project) ?? -1));
  const groups = new Set(sorted.map((t) => t.project));
  if (groups.size < 2 && groups.has(pid)) return sorted.map(threadHtml).join('');
  let last = null;
  return sorted.map((t) => {
    let head = '';
    if (t.project !== last) {
      last = t.project;
      const p = projectById(t.project);
      head = '<div class="subgroup" style="--pc:' + (p ? p.color : 'var(--muted)') + '"><span class="pdot"></span>' + esc(p ? (p.id === pid ? p.name : projectPath(p, pid)) : '') + '</div>';
    }
    return head + threadHtml(t);
  }).join('');
}

function sectionHtml(s, list, bare) {
  const collapsed = !bare && ui.collapsedSections.has(s.id);
  const empty = s.id === 'ongoing' ? 'Drag long-running threads here.' : 'Nothing here. Drag threads in.';
  return '<div class="section' + (collapsed ? ' collapsed' : '') + (bare ? ' bare' : '') + '" data-section="' + s.id + '">'
    + (bare ? '' : '<div class="section-head" data-action="toggle-section"><span class="caret"></span><span>' + s.label + '</span><span class="count">' + list.length + '</span></div>')
    + (collapsed ? '' : list.length ? groupedRowsHtml(list) : '<div class="section-empty">' + empty + '</div>')
    + '</div>';
}

function threadHtml(t, inDetail) {
  const open = inDetail === true || ui.expanded.has(t.id);
  const proj = projectById(t.project);
  const subs = itemsOf(t.id, 'task');
  const done = subs.filter((i) => i.done).length;
  const next = subs.find((i) => !i.done);
  const latest = items.filter((i) => i.threadId === t.id && i.kind === 'note').sort((a, b) => (a.created < b.created ? 1 : -1))[0];
  const title = editingThread === t.id
    ? '<form class="title-form" data-title-form="' + t.id + '"><input class="title-input" data-focus="title:' + t.id + '" value="' + esc(t.title) + '" placeholder="Thread name" enterkeyhint="done"></form>'
    : '<button class="star-btn' + (t.star ? ' on' : '') + '" data-action="star" draggable="false" title="' + (t.star ? 'Unstar' : 'Star: keep at the top') + '">'
      + '<svg viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M8 1.8l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.6l-3.8 2 .7-4.3-3.1-3 4.3-.6z"/></svg>'
      + '</button>'
      + '<span class="title-text" title="' + esc(t.title) + '">' + (t.title ? esc(t.title) : '<span class="muted">Untitled</span>') + '</span>'
      + '<button class="edit" data-action="rename" draggable="false" title="Rename">'
      + '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 2.5l2.5 2.5L5.5 13H3v-2.5z"/><path d="M9.5 4l2.5 2.5"/></svg>'
      + '</button>'
      + '<button class="pin-btn' + (t.pin ? ' on' : '') + '" data-action="pin" data-id="' + t.id + '" draggable="false" title="' + (t.pin ? 'Remove from favorites' : 'Favorite: show as a small bar in the left column') + '">'
      + '<svg viewBox="0 0 16 16" fill="' + (t.pin ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M8 13.6s-5.3-3.2-5.3-7A2.9 2.9 0 0 1 8 4.8a2.9 2.9 0 0 1 5.3 1.8c0 3.8-5.3 7-5.3 7z"/></svg>'
      + '</button>'
      + '<button class="dim-btn' + (t.dim ? ' on' : '') + '" data-action="dim" draggable="false" title="' + (t.dim ? 'Undim' : 'Dim: keep it visible but quiet') + '">'
      + '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 9.6A5.6 5.6 0 1 1 6.4 2.5a4.4 4.4 0 0 0 7.1 7.1z"/></svg>'
      + '</button>'
      + (t.due ? '<span class="due-badge' + (isOverdue(t.due, t.status === 'done') ? ' overdue' : '') + '" title="Due ' + fmtDay(t.due) + '">' + fmtDay(t.due) + '</span>' : '')
      + (proj ? '<button class="pchip" data-action="open-project" data-project="' + proj.id + '" draggable="false" style="--pc:' + proj.color + '" title="Open project ' + esc(projectPath(proj)) + '"><span class="pdot"></span><span class="pchip-name">' + esc(proj.name) + '</span></button>' : '')
      + linkBadgeHtml(threadLinks(t.id), autoSessions(t.slug));
  const progress = subs.length
    ? '<span class="bar"><i style="width:' + Math.round((done / subs.length) * 100) + '%"></i></span><span>' + done + '/' + subs.length + '</span>'
    : '<span class="muted">-</span>';
  const progressCls = subs.length ? 'progress' : 'progress none';
  return '<section class="thread' + (open ? ' open' : '') + (t.dim ? ' dimmed' : '') + (proj ? ' has-project' : '') + '" data-thread="' + t.id + '"' + (proj ? ' style="--pc:' + proj.color + '"' : '') + '>'
    + '<div class="row grid" data-action="toggle">'
    + '<span class="grip" draggable="true" data-drag="thread" data-id="' + t.id + '" title="Drag to reorder"></span>'
    + '<span class="caret"></span>'
    + (editingThread === t.id
      ? '<div class="title">' + title + '</div>'
      : '<div class="title" draggable="true" data-drag="thread" data-id="' + t.id + '" title="Drag to reorder, double-click to rename">' + title + '</div>')
    + '<select class="status s-' + t.status + '" data-action="status">' + STATUSES.map((s) => '<option value="' + s + '"' + (s === t.status ? ' selected' : '') + '>' + s + '</option>').join('') + '</select>'
    + '<div class="' + progressCls + '">' + progress + '</div>'
    + '<div class="next clip">' + (next ? linkify(firstLine(next.text)) : '') + '</div>'
    + '<div class="latest clip">' + (latest ? '<span class="when">' + ago(latest.created) + '</span>' + linkify(firstLine(latest.text)) : '') + '</div>'
    + '<div class="updated muted">' + ago(lastTouched(t)) + '</div>'
    + '</div>'
    + (open ? panelHtml(t) : '')
    + '</section>';
}

function panelHtml(t) {
  const backlinks = items.filter((i) => i.threadId !== t.id && i.refs.includes(t.id));
  return linkStripHtml(threadLinks(t.id), 'thread:' + t.id, autoSessions(t.slug))
    + '<div class="panel">' + Object.keys(KINDS).map((k) => columnHtml(t, k)).join('') + '</div>'
    + '<div class="panel-foot">'
    + '<label class="due-field">Due <input type="date" data-action="set-due" value="' + (t.due || '') + '"></label>'
    + '<label class="due-field">Project <select data-action="set-project"><option value="">None</option>'
    + projectTreeOrder().filter((x) => x.p.created).map((x) => '<option value="' + x.p.id + '"' + (x.p.id === t.project ? ' selected' : '') + '>' + '&nbsp;&nbsp;'.repeat(x.depth) + esc(x.p.name) + '</option>').join('')
    + '</select></label>'
    + '<label class="due-field">Slug <input class="tslug-input" data-action="set-slug" value="' + esc(t.slug) + '" placeholder="optional" autocomplete="off" autocapitalize="off" spellcheck="false"></label>'
    + (t.due ? '<button data-action="clear-due">Clear date</button>' : '')
    + (t.project ? '<span class="due-field">Needs</span>' + depEditorHtml(t.after || [], depOptions(t, null), 'thread-dep', true) : '')
    + (backlinks.length ? '<span class="muted">Referenced by</span>' + backlinks.map((i) => {
      const src = threadById(i.threadId);
      return '<span class="chip" data-goto="' + i.threadId + '" title="' + esc(i.text) + '">' + esc((src ? src.title : '?') + ': ' + firstLine(i.text).slice(0, 40)) + '</span>';
    }).join('') : '')
    + '<span class="spacer"></span>'
    + SECTIONS.filter((s) => s.id !== t.section).map((s) => '<button data-action="move-section" data-section="' + s.id + '">Move to ' + s.label + '</button>').join('')
    + '<button data-action="dim">' + (t.dim ? 'Undim' : 'Dim') + '</button>'
    + '<button data-action="rename">Rename</button>'
    + mergeOptionsHtml(t)
    + '<button class="danger" data-action="delete-thread">Delete thread</button>'
    + '</div>';
}

function columnHtml(t, kind) {
  const list = itemsOf(t.id, kind);
  const key = 'add:' + t.id + ':' + kind;
  const field = kind === 'task'
    ? '<input data-add="task" data-focus="' + key + '" placeholder="Add subtask" enterkeyhint="done" autocomplete="off">'
    : '<textarea rows="1" data-add="' + kind + '" data-focus="' + key + '" placeholder="' + (kind === 'note' ? 'Add note' : 'Record decision') + '"></textarea>';
  const add = '<form class="add-form" data-add-form="' + kind + '">' + field + '<button type="submit" class="add-btn">Add</button></form>';
  const count = kind === 'task' && list.length ? list.filter((i) => i.done).length + '/' + list.length : (list.length || '');
  return '<div class="col">'
    + '<h3><span>' + KINDS[kind] + '</span><span>' + count + '</span></h3>'
    + (NEWEST_FIRST[kind] ? add : '')
    + '<div class="list" data-list="' + kind + '" data-thread="' + t.id + '">'
    + (list.length ? list.map(itemHtml).join('') : '<div class="empty">Nothing yet, or drop here</div>')
    + '</div>'
    + (NEWEST_FIRST[kind] ? '' : add)
    + '</div>';
}

function itemHtml(i) {
  if (editingItem === i.id) return editorHtml(i);
  const meta = [];
  if (i.kind !== 'task' && i.kind !== 'scratch' && i.created) meta.push('<span>' + stamp(i.created) + '</span>');
  if (i.kind === 'task' && i.due) meta.push('<span class="chip due' + (isOverdue(i.due, i.done) ? ' overdue' : '') + '">Due ' + fmtDay(i.due) + '<button data-action="clear-item-due" title="Clear date">x</button></span>');
  if (i.link) meta.push('<a class="chip" href="' + esc(i.link) + '" target="_blank" rel="noopener">' + esc(shortUrl(i.link)) + '</a>');
  i.refs.forEach((r) => {
    const t = threadById(r);
    meta.push('<span class="chip ref" data-goto="' + r + '">' + esc(t ? t.title || 'Untitled' : 'missing') + '</span>');
  });
  return '<div class="item k-' + i.kind + (i.done ? ' done' : '') + '" data-item="' + i.id + '">'
    + '<span class="grip" draggable="true" data-drag="item" data-id="' + i.id + '" title="Drag to reorder or move"></span>'
    + (i.kind === 'task' || i.kind === 'scratch' ? '<input type="checkbox" data-action="check"' + (i.done ? ' checked' : '') + '>' : '')
    + '<div class="body" data-action="edit-item"><div class="text">' + linkify(i.text) + '</div>'
    + (meta.length ? '<div class="meta">' + meta.join('') + '</div>' : '')
    + '</div>'
    + '<button class="x" data-action="delete-item" title="Delete">x</button>'
    + '</div>';
}

function editorHtml(i) {
  const d = editDraft;
  const options = sortedThreads().filter((t) => t.id !== i.threadId && !d.refs.includes(t.id))
    .map((t) => '<option value="' + t.id + '">' + esc(t.title || 'Untitled') + '</option>').join('');
  return '<div class="item k-' + i.kind + '" data-item="' + i.id + '">'
    + '<div class="editor" data-editor="' + i.id + '">'
    + '<textarea class="e-text" data-focus="edit:' + i.id + '" rows="1">' + esc(d.text) + '</textarea>'
    + '<div class="row2">'
    + '<input class="e-link" data-focus="link:' + i.id + '" placeholder="Link URL (PR, ticket, doc)" value="' + esc(d.link) + '">'
    + d.refs.map((r) => {
      const t = threadById(r);
      return '<span class="chip ref">' + esc(t ? t.title || 'Untitled' : 'missing') + '<button data-action="unref" data-ref="' + r + '">x</button></span>';
    }).join('')
    + (options ? '<select data-action="addref"><option value="">+ Link thread</option>' + options + '</select>' : '')
    + (i.kind === 'task' ? '<label class="due-field">Due <input type="date" class="e-due" value="' + (d.due || '') + '"></label>' : '')
    + '</div>'
    + (i.kind === 'task' ? depEditorHtml(d.after, depOptions(threadById(i.threadId), i.id), 'edit-dep') : '')
    + '<div class="row2"><button data-action="save-edit" class="primary">Save</button><button data-action="cancel-edit">Cancel</button>'
    + '<span class="hint">Enter saves, Shift+Enter newline, Esc cancels. Empty text deletes.</span></div>'
    + '</div></div>';
}

function toggle(id) {
  if (ui.expanded.has(id)) ui.expanded.delete(id);
  else ui.expanded.add(id);
  saveUi();
  render();
}

function goto(id) {
  const t = threadById(id);
  if (!t) return;
  const pid = viewProjectId();
  if (pid && !subtreeIds(pid).has(t.project)) history.replaceState(null, '', location.pathname + location.search);
  if (!visibleThreads().includes(t)) {
    ui.filter = 'all';
    document.getElementById('search').value = '';
  }
  ui.expanded.add(id);
  ui.collapsedSections.delete(t.section);
  saveUi();
  render();
  const el = document.querySelector('[data-thread="' + id + '"]');
  if (el) {
    el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    el.classList.add('flash');
    setTimeout(() => el.classList.remove('flash'), 1300);
  }
}

function newThread() {
  if (isListsView() || isPeopleView()) history.replaceState(null, '', location.pathname + location.search);
  const min = threads.filter((t) => t.section === 'now').reduce((m, t) => Math.min(m, t.position), 1);
  const t = { id: uid(), title: '', status: 'active', position: min - 1, created: now(), updated: now(), section: 'now', project: viewProjectId() };
  threads.push(t);
  ui.expanded.add(t.id);
  ui.collapsedSections.delete('now');
  if (ui.filter !== 'open' && ui.filter !== 'all' && ui.filter !== 'active') ui.filter = 'open';
  document.getElementById('search').value = '';
  saveUi();
  editingThread = t.id;
  pendingFocus = 'title:' + t.id;
  render();
}

function commitTitle(id, value, cancel) {
  const t = threadById(id);
  editingThread = null;
  if (!t) return render();
  const title = cancel ? t.title : value.trim();
  if (!title && !t.title && !items.some((i) => i.threadId === id)) {
    threads = threads.filter((x) => x !== t);
    if (t.created) queueDelete('Threads', id);
  } else if (title && title !== t.title) {
    t.title = title;
    saveThread(t);
  } else if (!title && !t.title) {
    saveThread(t);
  }
  render();
}

function addItem(threadId, kind, text) {
  text = text.trim();
  if (!text) return;
  const sibs = itemsOf(threadId, kind);
  const position = NEWEST_FIRST[kind]
    ? sibs.reduce((m, i) => Math.min(m, i.position), 1) - 1
    : sibs.reduce((m, i) => Math.max(m, i.position), -1) + 1;
  const i = normItem({ id: uid(), threadId, kind, text, done: false, position, created: now() });
  items.push(i);
  saveItem(i);
  const t = threadById(threadId);
  if (t && !t.title) saveThread(t);
  pendingFocus = 'add:' + threadId + ':' + kind;
  render();
}

function startEdit(id) {
  const i = itemById(id);
  if (!i) return;
  editingItem = id;
  editDraft = { text: i.text, link: i.link, refs: i.refs.slice(), due: i.due, after: (i.meta.after || []).slice() };
  pendingFocus = 'edit:' + id;
  render();
}

function commitEdit(cancel) {
  const i = itemById(editingItem);
  const d = editDraft;
  editingItem = null;
  editDraft = null;
  if (i && !cancel) {
    if (!d.text.trim()) {
      removeItems([i]);
      return;
    }
    const changed = d.text !== i.text || d.link.trim() !== i.link || d.refs.join(',') !== i.refs.join(',') || d.due !== i.due || d.after.join(',') !== (i.meta.after || []).join(',');
    if (changed) {
      i.meta = Object.assign({}, i.meta, { after: d.after });
      if (!d.after.length) delete i.meta.after;
      i.text = d.text;
      i.link = d.link.trim();
      i.refs = d.refs;
      i.due = d.due;
      saveItem(i);
    }
  }
  render();
}

function setThreadDue(id, date) {
  const t = threadById(id);
  if (!t) return;
  if (!date) {
    t.due = '';
    t.start = '';
  } else {
    t.due = date;
    if (!t.start) t.start = todayYmd();
    if (t.start > date) t.start = date;
  }
  saveThread(t);
  render();
}

function setItemDue(id, date) {
  const i = itemById(id);
  if (!i || i.kind !== 'task') return;
  i.due = date || '';
  saveItem(i);
  render();
}

const LINK_TYPES = {
  slack: { icon: 'S', label: 'Slack' },
  session: { icon: '&gt;_', label: 'Claude session' },
  pr: { icon: 'PR', label: 'Pull request' },
  md: { icon: 'MD', label: 'Markdown doc' },
  jira: { icon: 'J', label: 'Jira' },
  doc: { icon: 'D', label: 'Google' },
  web: { icon: '@', label: 'Link' },
};
const SESSION_RE = /^(?:session:)?([0-9a-f]{8}(?:-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})?)$/i;

function linkInfo(url, meta) {
  let m;
  if (url.startsWith('mddoc:')) {
    const d = docByKey(url.slice(6));
    return { type: 'md', sub: d ? tildePath(d.path) : 'doc no longer synced', title: d ? d.title : 'Markdown doc', docKey: url.slice(6) };
  }
  if (meta && meta.session) return { type: 'session', sub: String(meta.session).slice(0, 8), title: 'Claude session ' + String(meta.session).slice(0, 8) };
  if ((m = url.match(/slack\.com\/archives\/([A-Z0-9]+)\/p(\d+)/))) return { type: 'slack', sub: meta && meta.channelName ? meta.channelName : m[1], title: 'Slack thread', channel: m[1], ts: m[2].slice(0, 10) + '.' + m[2].slice(10) };
  if ((m = url.match(/\/pull\/(\d+)/))) {
    const key = prRows.length || syncInfo.heartbeat ? prKeyOf(url) : '';
    const r = key ? prRowFor(url) : null;
    return { type: 'pr', sub: key ? prSubHtml(r, m[1]) : '#' + m[1], title: r && r.title ? r.title : 'PR ' + m[1], rawSub: !!key, pr: r, prKey: key };
  }
  if ((m = url.match(/\/browse\/([A-Z][A-Z0-9]+-\d+)/))) {
    const f = flags.find((x) => x.key === m[1]);
    return { type: 'jira', sub: f ? m[1] + ' &middot; ' + f.status + (f.alerts.length ? ' &middot; ' + f.alerts.length + ' to check' : '') : m[1], title: f ? f.flag : m[1], rawSub: !!f };
  }
  if ((m = url.match(/docs\.google\.com\/(document|spreadsheets|presentation)/))) {
    const kind = { document: 'Doc', spreadsheets: 'Sheet', presentation: 'Slides' }[m[1]];
    return { type: 'doc', sub: kind, title: 'Google ' + kind };
  }
  return { type: 'web', sub: shortUrl(url).split('/')[0], title: shortUrl(url) };
}

function parseLinkInput(text) {
  const v = String(text || '').trim();
  const sm = v.match(SESSION_RE);
  if (sm) return { link: 'session:' + sm[1].toLowerCase(), meta: { session: sm[1].toLowerCase() } };
  if (/^https?:\/\/\S+$/i.test(v)) return { link: v, meta: {} };
  if (/^mddoc:[0-9a-f]{12}$/.test(v)) return { link: v, meta: {} };
  const d = /\.md$/i.test(v) && docs.find((x) => x.path === v.replace(/^~(?=\/)/, HOME_GUESS()) || x.path === v);
  if (d) return { link: 'mddoc:' + d.key, meta: {} };
  return null;
}

function threadLinks(tid) { return items.filter((i) => i.kind === 'link' && i.threadId === tid).sort((a, b) => a.position - b.position); }
function projectLinks(pid) { return items.filter((i) => i.kind === 'link' && !i.threadId && i.projectId === pid).sort((a, b) => a.position - b.position); }
function inboxLinks() {
  return items.filter((i) => i.kind === 'link' && !i.threadId && (!i.projectId || !projectById(i.projectId)) && !i.meta.dismissed && !i.meta.flag && !i.meta.flagName && !i.meta.review)
    .sort((a, b) => (a.created < b.created ? 1 : -1));
}

function linkPlace(i) {
  if (i.threadId) {
    const t = threadById(i.threadId);
    return t ? '"' + (t.title || 'Untitled') + '"' : 'a thread';
  }
  const p = projectById(i.projectId);
  return p ? 'project "' + projectPath(p) + '"' : 'the Inbox';
}

function linkCardHtml(i, assign) {
  const info = linkInfo(i.link, i.meta);
  if (info.type === 'session') return sessionCardHtml(sessionByKey(i.meta.session), { item: i, assign, key: i.meta.session });
  if (info.type === 'slack') return slackCardHtml(i, assign);
  const type = LINK_TYPES[info.type];
  const title = esc(i.title || info.title);
  const main = info.type === 'md'
    ? '<button class="ltitle" data-action="open-doc" data-key="' + esc(info.docKey) + '" title="Read it in Junction">' + title + '</button>'
    : info.type === 'session'
    ? '<button class="ltitle" data-action="open-session" data-session="' + esc(i.meta.session) + '" title="Open this session">' + title + '</button>'
    : '<a class="ltitle" href="' + esc(i.link) + '" target="_blank" rel="noopener" title="' + esc(i.link) + '">' + title + '</a>';
  const pbusy = info.prKey && jobs['pr:' + info.prKey];
  return '<div class="lcard t-' + info.type + (info.pr ? ' lvl-' + esc(info.pr.level) : '') + '" data-item="' + i.id + '" data-link="' + i.id + '"' + (info.pr ? ' title="' + esc(prDetail(info.pr)) + '"' : '') + '>'
    + '<span class="grip" draggable="true" data-drag="item" data-id="' + i.id + '" title="Drag onto a thread, project or the Inbox"></span>'
    + '<span class="licon" title="' + type.label + '">' + type.icon + '</span>'
    + '<span class="lmain">' + main + '<span class="lsub">' + (info.rawSub ? info.sub : esc(info.sub)) + '</span></span>'
    + (info.prKey ? '<button class="ssum" data-action="update-pr" data-url="' + esc(i.link) + '"' + (pbusy ? ' disabled' : '') + ' title="Get the latest PR status">' + (pbusy ? 'Updating...' : 'Update') + '</button>' : '')
    + (assign ? assignSelectHtml(i) : '')
    + '<button class="ledit" data-action="rename-link" title="Rename">' + PENCIL + '</button>'
    + '<button class="x" data-action="delete-item" title="Remove">x</button>'
    + '</div>';
}

function assignSelectHtml(i) {
  const projOpts = projectTreeOrder().filter((x) => x.p.created).map((x) => '<option value="p:' + x.p.id + '">' + '&nbsp;&nbsp;'.repeat(x.depth) + esc(x.p.name) + '</option>').join('');
  const threadOpts = sortedThreads().filter((t) => t.status !== 'done').map((t) => '<option value="t:' + t.id + '">' + esc(t.title || 'Untitled') + '</option>').join('');
  return '<select class="lassign" data-action="assign-link"><option value="">Assign to...</option>'
    + (projOpts ? '<optgroup label="Projects">' + projOpts + '</optgroup>' : '')
    + (threadOpts ? '<optgroup label="Threads">' + threadOpts + '</optgroup>' : '')
    + '</select>';
}

let laddOpen = null;

function linkStripHtml(list, where, auto) {
  const adding = laddOpen === where;
  auto = auto || [];
  return '<div class="lstrip' + (list.length || auto.length || adding ? '' : ' bare') + '" data-lwhere="' + where + '">'
    + list.map((i) => linkCardHtml(i, false)).join('')
    + auto.map((x) => sessionCardHtml(x, {})).join('')
    + summaryPanelHtml(list, where)
    + (adding
      ? '<form class="ladd-form" data-ladd="' + where + '"><input class="ladd" data-focus="ladd:' + where + '" placeholder="Paste a link, Enter to add" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done"></form>'
      : '<button class="ladd-btn" data-action="show-ladd" data-where="' + where + '">+ Link</button>')
    + '</div>';
}

function linkBadgeHtml(list, auto) {
  const slack = list.filter((i) => linkInfo(i.link, i.meta).type === 'slack').map(slackState);
  const plain = list.filter((i) => !['session', 'slack'].includes(linkInfo(i.link, i.meta).type));
  const sess = list.filter((i) => linkInfo(i.link, i.meta).type === 'session').map((i) => sessionByKey(i.meta.session)).filter(Boolean).concat(auto || []);
  const live = sess.filter((x) => !x.earlier && x.state !== 'gone');
  const need = !syncLongStale() && live.some((x) => x.need);
  let out = '';
  const unread = slack.reduce((n, x) => n + x.unread, 0);
  const slackNeed = slack.some((x) => x.need);
  const prNeed = [...new Set(list.map((i) => prRowFor(i.link)))].filter((r) => r && (r.level === 'bad' || r.level === 'warn'));
  if (prNeed.length) {
    const bad = prNeed.some((r) => r.level === 'bad');
    const text = prNeed.length === 1 ? prNeed[0].label : prNeed.length + ' PRs need you';
    out += '<span class="lbadge prbadge' + (bad ? ' bad' : '') + '" title="' + esc(prNeed.map((r) => r.title + ': ' + r.label).join('\n')) + '">PR<span class="lbadge-word"> ' + esc(text) + '</span></span>';
  }
  if (unread) out += '<span class="lbadge slackbadge' + (slackNeed ? ' need' : '') + '" title="' + unread + ' new Slack repl' + (unread === 1 ? 'y' : 'ies') + (slackNeed ? ', one mentions you' : '') + '">S ' + unread + '<span class="lbadge-word"> new' + (slackNeed ? ' &middot; needs you' : '') + '</span></span>';
  if (plain.length + slack.filter((x) => !x.unread).length) {
    const n = plain.length + slack.filter((x) => !x.unread).length;
    out += '<span class="lbadge" title="' + n + ' link' + (n === 1 ? '' : 's') + '">' + n + '<span class="lbadge-word"> link' + (n === 1 ? '' : 's') + '</span></span>';
  }
  if (live.length) {
    out += '<span class="lbadge sbadge' + (need ? ' need' : '') + '" title="' + live.length + ' Claude session' + (live.length === 1 ? '' : 's') + (need ? ', one needs you' : '') + '">'
      + '<span class="sdot2"></span>' + live.length + '<span class="lbadge-word"> session' + (live.length === 1 ? '' : 's') + (need ? ' &middot; needs you' : '') + '</span></span>';
  }
  return out;
}

function whereToTarget(where) {
  const [kind, id] = String(where || '').split(':');
  if (kind === 'thread') return { threadId: id, projectId: '' };
  if (kind === 'project') return { threadId: '', projectId: id };
  return { threadId: '', projectId: '' };
}

function addLink(text, where) {
  const parsed = parseLinkInput(text);
  if (!parsed) {
    showToast('That does not look like a link or a session id', true);
    return false;
  }
  const existing = items.find((i) => i.kind === 'link' && i.link === parsed.link && !i.meta.dismissed && !i.meta.flagName && !i.meta.flag && !i.meta.review);
  if (existing) {
    showToast('Already tracked in ' + linkPlace(existing), true);
    return false;
  }
  const to = whereToTarget(where);
  const siblings = items.filter((i) => i.kind === 'link' && i.threadId === to.threadId && i.projectId === to.projectId);
  const i = normItem({
    id: uid(), threadId: to.threadId, projectId: to.projectId, kind: 'link', text: '', link: parsed.link, title: '',
    meta: slackKeyOf(parsed.link) ? Object.assign({ trackedAt: now() }, parsed.meta) : parsed.meta, position: siblings.reduce((m, x) => Math.max(m, x.position), -1) + 1, created: now(),
  });
  items.push(i);
  saveItem(i);
  if (!to.threadId && !to.projectId) ui.inboxOpen = true;
  saveUi();
  return true;
}

function attachLink(id, to) {
  const i = itemById(id);
  if (!i || i.kind !== 'link') return;
  const threadId = to.threadId || '';
  const projectId = threadId ? '' : to.projectId || '';
  if (i.threadId === threadId && i.projectId === projectId) return render();
  i.threadId = threadId;
  i.projectId = projectId;
  i.position = items.filter((x) => x !== i && x.kind === 'link' && x.threadId === threadId && x.projectId === projectId).reduce((m, x) => Math.max(m, x.position), -1) + 1;
  saveItem(i);
  showToast('Moved to ' + linkPlace(i), true);
  render();
}

function renameLink(id) {
  const i = itemById(id);
  if (!i) return;
  const v = prompt('Link title', i.title || linkInfo(i.link, i.meta).title);
  if (v === null) return;
  i.title = v.trim();
  saveItem(i);
  render();
}

const SLACK_KEY_RE = /slack\.com\/archives\/([A-Z0-9]+)\/p(\d{10})(\d{6})(?:\?[^\s]*?thread_ts=(\d{10}\.\d{6}))?/;
const SUMMARY_TIMEOUT_MS = 180000;

function slackKeyOf(url) {
  const m = String(url || '').match(SLACK_KEY_RE);
  return m ? m[1] + ':' + (m[4] || m[2] + '.' + m[3]) : '';
}

function slackPermalink(key) {
  const [channel, ts] = key.split(':');
  return SLACK_HOST ? SLACK_HOST + '/archives/' + channel + '/p' + ts.replace('.', '') : '';
}

function slackRowFor(i) { return slackThreads.find((r) => r.key === slackKeyOf(i.link)) || null; }
function slackSummaryFor(key) { return slackSummaries.find((r) => r.key === key) || null; }

function slackState(i) {
  const row = slackRowFor(i);
  if (!row) return { row: null, unread: 0, need: false };
  const since = Math.max(Number(i.meta.readTs) || 0, Number(row.myLastTs) || 0, Date.parse(i.meta.trackedAt || i.created || '') / 1000 || 0);
  const fresh = row.recent.filter((r) => Number(r[0]) > since);
  return { row, unread: fresh.length, need: fresh.some((r) => Number(r[2])) };
}

function slackCardHtml(i, assign) {
  const st = slackState(i);
  const row = st.row;
  const key = slackKeyOf(i.link);
  const title = i.title || (row && row.parentText ? row.parentText.slice(0, 70) : 'Slack thread');
  const who = row && row.parentBy ? row.parentBy : (i.meta.channelName || key.split(':')[0]);
  const sub = esc(who) + (row ? ' &middot; ' + row.replyCount + ' repl' + (row.replyCount === 1 ? 'y' : 'ies') + (row.newestTs ? ' &middot; ' + ago(new Date(Number(row.newestTs) * 1000).toISOString()) : '') : ' &middot; not checked yet') + (row && row.error ? ' &middot; check failed' : '');
  const busy = summarizing[key];
  const has = slackSummaryFor(key);
  return '<div class="lcard t-slack' + (st.unread ? ' unread' : '') + (st.need ? ' need' : '') + '" data-item="' + i.id + '" data-link="' + i.id + '"' + (row && row.parentText ? ' title="' + esc(row.parentBy + ': ' + row.parentText) + '"' : '') + '>'
    + '<span class="grip" draggable="true" data-drag="item" data-id="' + i.id + '" title="Drag onto a thread, project or the Inbox"></span>'
    + '<span class="licon" title="Slack">S</span>'
    + '<span class="lmain"><a class="ltitle" data-slack-open="' + i.id + '" href="' + esc(i.link) + '" target="_blank" rel="noopener">' + esc(title) + '</a><span class="lsub">' + sub + '</span></span>'
    + (st.unread ? '<span class="snew' + (st.need ? ' need' : '') + '">' + (st.need ? 'needs you' : st.unread + ' new') + '</span><button class="sread" data-action="slack-read" title="Mark read">&#10003;</button>' : '')
    + '<button class="ssum" data-action="' + (has ? 'toggle-summary' : 'summarize-slack') + '" data-key="' + key + '"' + (busy ? ' disabled' : '') + '>' + (busy ? 'Summarizing...' : has ? 'Summary' : 'Summarize') + '</button>'
    + (assign ? assignSelectHtml(i) : '')
    + '<button class="ledit" data-action="rename-link" title="Rename">' + PENCIL + '</button>'
    + '<button class="x" data-action="delete-item" title="Remove">x</button>'
    + '</div>';
}

function summaryPanelHtml(list, where) {
  const i = list.find((x) => slackKeyOf(x.link) && slackKeyOf(x.link) === summaryOpen);
  if (!i) return '';
  const sum = slackSummaryFor(summaryOpen);
  if (!sum) return '';
  const tid = whereToTarget(where).threadId;
  const fresh = sum.decisions.filter((d) => !items.some((x) => x.kind === 'decision' && x.threadId === tid && x.text === d));
  return '<div class="spanel">'
    + '<div class="spanel-head"><b>Summary</b><span class="muted">' + (sum.at ? stamp(sum.at) : '') + '</span><span class="spacer"></span>'
    + '<button data-action="summarize-slack" data-key="' + summaryOpen + '">Refresh</button><button data-action="toggle-summary" data-key="' + summaryOpen + '">Close</button></div>'
    + '<p>' + linkify(sum.summary) + '</p>'
    + (sum.decisions.length ? '<div class="spanel-label">Decisions</div><ul>' + sum.decisions.map((d) => '<li>' + linkify(d) + '</li>').join('') + '</ul>'
      + (tid ? (fresh.length ? '<button class="primary" data-action="add-decisions" data-key="' + summaryOpen + '" data-thread="' + tid + '">Add ' + fresh.length + ' decision' + (fresh.length === 1 ? '' : 's') + ' to this thread</button>' : '<span class="muted">All decisions are on this thread.</span>') : '') : '')
    + (sum.questions.length ? '<div class="spanel-label">Open questions</div><ul>' + sum.questions.map((q) => '<li>' + linkify(q) + '</li>').join('') + '</ul>' : '')
    + '</div>';
}

function markSlackRead(id) {
  const i = itemById(id);
  if (!i) return;
  const row = slackRowFor(i);
  if (!row || !row.newestTs) return;
  i.meta = Object.assign({}, i.meta, { readTs: row.newestTs });
  saveItem(i);
  render();
}

function summarizeSlack(key) {
  if (summarizing[key]) return;
  if (!syncAlive()) return showToast('Summaries run on the VDI sync, which is not running right now', true);
  const req = { id: uid(), kind: 'summarize-slack', target: key, created: now(), updated: now() };
  requests.push(req);
  queueUpsert('Requests', req);
  scheduleFlush(0);
  summarizing[key] = { req: req.id, at: Date.now() };
  render();
  const tick = async () => {
    const o = summarizing[key];
    if (!o) return;
    if (!pending.size && !inFlight) await load(true);
    const ack = acks.find((a) => a.requestId === o.req);
    if (ack || Date.now() - o.at > SUMMARY_TIMEOUT_MS) {
      delete summarizing[key];
      requests = requests.filter((r) => r.id !== o.req);
      queueDelete('Requests', o.req);
      if (ack && ack.status === 'done') summaryOpen = key;
      else showToast(ack ? 'Summary failed: ' + (ack.message || ack.status) : 'Summary timed out; the VDI may be busy', true);
      return render();
    }
    setTimeout(tick, 3000);
  };
  setTimeout(tick, 3000);
}

function addDecisions(key, tid) {
  const sum = slackSummaryFor(key);
  if (!sum) return;
  const link = slackPermalink(key);
  const have = new Set(items.filter((x) => x.kind === 'decision' && x.threadId === tid).map((x) => x.text));
  let n = 0;
  sum.decisions.filter((d) => !have.has(d)).forEach((d) => {
    const sibs = itemsOf(tid, 'decision');
    const i = normItem({ id: uid(), threadId: tid, kind: 'decision', text: d, link, position: sibs.reduce((m, x) => Math.min(m, x.position), 1) - 1, created: now() });
    items.push(i);
    saveItem(i);
    n += 1;
  });
  showToast('Added ' + n + ' decision' + (n === 1 ? '' : 's') + ' from Slack', true);
  render();
}

function slackItemFor(key) {
  return items.find((i) => i.kind === 'link' && slackKeyOf(i.link) === key);
}

function slackPlain(t) {
  return String(t || '').replace(/<(https?:\/\/[^|>]+)\|([^>]+)>/g, '$2').replace(/<(https?:\/\/[^>]+)>/g, '$1').replace(/<@[A-Z0-9]+(?:\|([^>]+))?>/g, (m, n) => '@' + (n || 'someone'))
    .replace(/<#[A-Z0-9]+\|([^>]+)>/g, '#$1').replace(/<!(here|channel|everyone)>/g, '@$1').replace(/:([a-z0-9_+-]+):/g, '').replace(/[ \t]+/g, ' ').trim();
}

function captureList() {
  return slackCaptures.filter((c) => !items.some((i) => i.meta.captureKey === c.key));
}

function captureCardHtml(c) {
  const text = slackPlain(c.text);
  return '<div class="lcard t-slack sugg capture" data-capture="' + esc(c.key) + '" title="' + esc(c.author + ': ' + text) + '">'
    + '<span class="licon">S</span>'
    + '<span class="lmain"><a class="ltitle" href="' + esc(c.permalink) + '" target="_blank" rel="noopener">' + esc(text.slice(0, 90) || 'Slack message') + '</a>'
    + '<span class="lsub">' + esc(c.author) + ' &middot; captured ' + ago(c.capturedAt) + ' ago' + (c.threadKey && slackItemFor(c.threadKey) ? ' &middot; thread already tracked' : '') + '</span></span>'
    + '<label class="cap-dec" title="Also add it to the thread\'s Decisions"><input type="checkbox" data-capture-dec="' + esc(c.key) + '"' + (captureNoDecision.has(c.key) ? '' : ' checked') + '> decision</label>'
    + '<select class="lassign" data-action="file-capture" data-key="' + esc(c.key) + '"><option value="">File in...</option>' + targetOptionsHtml(false) + '</select>'
    + '<button class="x" data-action="dismiss-capture" data-key="' + esc(c.key) + '" title="Not worth keeping">x</button>'
    + '</div>';
}

const captureNoDecision = new Set();

function fileCapture(key, to) {
  const c = slackCaptures.find((x) => x.key === key);
  if (!c) return;
  const [kind, id] = to.split(':');
  const target = kind === 't' ? { threadId: id, projectId: '' } : { threadId: '', projectId: id };
  const tracked = c.threadKey && slackItemFor(c.threadKey);
  if (!tracked && (c.threadKey || kind !== 't')) {
    const link = normItem({ id: uid(), kind: 'link', text: '', link: c.threadKey ? slackPermalink(c.threadKey) || c.permalink : c.permalink, title: '', meta: { trackedAt: now(), captureKey: key }, position: 0, created: now() });
    items.push(link);
    attachLink(link.id, target);
  }
  const dec = kind === 't' && !captureNoDecision.has(key);
  if (dec || tracked || (!c.threadKey && kind === 't')) {
    const text = slackPlain(c.text) + (c.author ? ' (' + c.author + ')' : '');
    const i = normItem({ id: uid(), threadId: dec ? id : '', projectId: '', kind: dec ? 'decision' : 'link', text: dec ? text : '', link: dec ? c.permalink : '', title: '',
      meta: dec ? { captureKey: key } : { captureKey: key, dismissed: true }, position: items.filter((x) => x.threadId === id && x.kind === 'decision').reduce((m, x) => Math.min(m, x.position), 1) - 1, created: now() });
    items.push(i);

function sessionByKey(key) {

function sessionLinkItem(x) {

function slugOwnerItem(slug) {
  if (!slug) return null;

function slugIgnored(slug) {

function autoSessions(slug) {

function sessionSuggestions() {

function effortSuggestions() {

    + '<form class="flag-form" data-flag-form="1"><input class="flag-add" data-focus="flag-add" placeholder="+ Track a PFF ticket (PFF-123 or link)" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done"></form>'

function flagWatchItems(key) {
  return items.filter((i) => i.kind === 'link' && i.meta.flag && flagKeyOf(i.link) === (key || flagKeyOf(i.link)));
}

function flagKeyOf(text) {
  const m = String(text || '').toUpperCase().match(/\bPFF-\d+\b/);
  return m ? m[0] : '';
}

function trackFlag(text) {
  const key = flagKeyOf(text);
  if (!key) {
    showToast('Enter a PFF key like PFF-123 or a PFF Jira link', true);
    return false;
  }
  const linked = items.find((i) => i.kind === 'link' && flagKeyOf(i.link) === key && /\/browse\//.test(i.link));
  if (linked) {
    showToast(key + ' is already tracked' + (linked.meta.flag ? '' : ' (linked in ' + linkPlace(linked) + ')'), true);
    return false;
  }
  if (flags.some((f) => f.key === key)) {
    showToast(key + ' is already in the list', true);
    return false;
  }
  const i = normItem({ id: uid(), threadId: '', projectId: '', kind: 'link', text: '', link: JIRA_BROWSE + key, title: '', meta: { flag: true }, position: 0, created: now() });
  items.push(i);
  saveItem(i);
  if (syncAlive()) refreshFlags();
  else showToast('Tracking ' + key + '; it shows once the VDI sync runs', true);
  return true;
}

function flagNameItem(key) {
  return items.find((i) => i.kind === 'link' && i.meta.flagName && flagKeyOf(i.link) === key) || null;
}

function setFlagName(key) {
  const f = flags.find((x) => x.key === key);
  const cur = flagNameItem(key);
  const v = prompt('Flagsmith flag name for ' + key + ' (leave empty to read it from the ticket title again)', cur ? cur.meta.flagName : f ? f.flag : '');
  if (v === null) return;
  const name = v.trim();
  if (!name) {
    if (cur) removeItems([cur]);
  } else if (!/^[A-Za-z0-9_\-.]+$/.test(name)) {
    return showToast('Flag names are letters, numbers, _ - and . only', true);
  } else if (cur) {
    cur.meta = Object.assign({}, cur.meta, { flagName: name });
    saveItem(cur);
  } else {
    const i = normItem({ id: uid(), threadId: '', projectId: '', kind: 'link', text: '', link: JIRA_BROWSE + key, title: '', meta: { flagName: name }, position: 0, created: now() });
    items.push(i);
    saveItem(i);
  }
  if (f && name) f.flag = name;
  if (syncAlive()) refreshFlags();
  else showToast('Saved. It applies on the next flags check.', true);
  render();
}

function untrackFlag(key) {
  const list = flagWatchItems(key);
  if (!list.length) return;
  removeItems(list);
  untrackedFlags.keys.add(key);
  untrackedFlags.at = syncInfo.lastFlags || '';
  flags = flags.filter((f) => f.key !== key);
  if (syncAlive()) refreshFlags();
  render();
}

function renderFlags() {
  const box = document.getElementById('flags');
  if (!flags.length && !syncInfo.lastFlags) {
    box.innerHTML = '';
    box.className = 'hidden';
    return;
  }
  box.className = ui.flagsOpen ? 'open' : '';
  box.innerHTML = flagsHtml();
}

function syncJob(key, kind, target, msg) {
  if (jobs[key]) return;
  if (!syncAlive()) return showToast(msg.down, true);
  const req = { id: uid(), kind, target, created: now(), updated: now() };
  requests.push(req);
  queueUpsert('Requests', req);
  scheduleFlush(0);
  jobs[key] = { req: req.id, at: Date.now() };
  render();
  const tick = async () => {
    const o = jobs[key];
    if (!o) return;
    if (!pending.size && !inFlight) await load(true);
    const ack = acks.find((a) => a.requestId === o.req);
    if (ack || Date.now() - o.at > 90000) {
      delete jobs[key];
      requests = requests.filter((r) => r.id !== o.req);
      queueDelete('Requests', o.req);
      if (!ack || ack.status !== 'done' || msg.done) showToast(ack && ack.status === 'done' ? msg.done : ack ? msg.fail + ': ' + ack.message : msg.fail + ': timed out', true);
      return render();
    }
    setTimeout(tick, 2500);
  };
  setTimeout(tick, 2500);
}

function refreshFlags() {
  syncJob('flags', 'refresh-flags', '', { down: 'Flags refresh runs on the VDI sync, which is not running right now', done: 'Flags refreshed', fail: 'Flags refresh failed' });
}

function prKeyOf(url) {
  const m = String(url || '').match(/^https?:\/\/[^/]+\/([^/]+)\/([^/]+)\/pull\/(\d+)/);
  return m ? m[1] + '/' + m[2] + '#' + m[3] : '';
}

function normPr(r) {

    } catch (e) {
      return d;
    }
  };
  return {
    raw: r, key: String(r.key), url: String(r.url || ''), title: String(r.title || ''), state: String(r.state || ''), draft: String(r.draft).toUpperCase() === 'TRUE',
    label: String(r.label || ''), level: String(r.level || 'info'), review: String(r.review || ''), merge: String(r.merge || ''),
    checks: parse(r.checks, {}), failed: parse(r.failed, []), newComments: Number(r.newComments) || 0, branch: String(r.branch || ''),
    updatedAt: String(r.updatedAt || ''), mergedAt: String(r.mergedAt || ''), checkedAt: String(r.checkedAt || ''), error: String(r.error || ''),
    myAt: String(r.myAt || ''), myState: String(r.myState || ''), pushedAt: String(r.pushedAt || ''), authorAt: String(r.authorAt || ''), requested: isTrue(r.requested), author: String(r.author || ''),
  };
}

function prRowFor(url) {
  const key = prKeyOf(url);
  return key ? prRows.find((r) => r.key === key) || null : null;
}

const PR_RANK = { bad: 0, warn: 1, good: 2, info: 3, done: 4 };

function prDetail(r) {
  const c = r.checks || {};
  const parts = [];
  if (r.failed.length) parts.push('Failing: ' + r.failed.join(', '));
  if (c.pending) parts.push(c.pending + ' checks running');
  if (r.review) parts.push('Reviewable: ' + r.review);
  if (r.merge) parts.push('Merge: ' + r.merge);
  if (r.error) parts.push('Last check failed: ' + r.error);
  if (r.checkedAt) parts.push('Checked ' + ago(r.checkedAt) + ' ago');
  return parts.join('\n');
}

function prChipHtml(r) {
  if (!r) return '<span class="prchip info">not checked yet</span>';
  return '<span class="prchip ' + esc(r.level) + '">' + esc(r.label) + '</span>' + (r.error ? '<span class="prerr" title="' + esc(r.error) + '">!</span>' : '');
}

function prSubHtml(r, n) {
  const bits = [prChipHtml(r)];
  if (r && r.state === 'OPEN' && r.review && !r.failed.length) bits.push(esc(r.review));
  else if (r && r.failed.length) bits.push(esc(r.failed.slice(0, 2).join(', ')) + (r.failed.length > 2 ? ' +' + (r.failed.length - 2) : ''));
  else if (r && r.mergedAt) bits.push(esc(stamp(r.mergedAt)));
  else bits.push('#' + n);
  return bits.join(' ');
}

function updatePr(url) {

  if (key) syncJob('pr:' + key, 'refresh-prs', url, { down: 'PR updates run on the VDI sync, which is not running right now', done: '', fail: 'PR update failed' });
}

function updateAllPrs() {
  syncJob('prs', 'refresh-prs', '', { down: 'PR updates run on the VDI sync, which is not running right now', done: 'PRs updated', fail: 'PR update failed' });
}

function trackedPrLinks() {
  const seen = new Map();
  items.filter((i) => i.kind === 'link' && prKeyOf(i.link) && !i.meta.review).forEach((i) => {
    const key = prKeyOf(i.link);
    if (!seen.has(key)) seen.set(key, i);
  });
  return [...seen.entries()].map(([key, i]) => ({ key, item: i, row: prRows.find((r) => r.key === key) || null }))
    .concat(prRows.filter((r) => !seen.has(r.key) && r.raw.source === 'mine' && !reviewItems().some((i) => prKeyOf(i.link) === r.key)).map((r) => ({ key: r.key, item: null, row: r })));
}

function reviewItems() {
  return items.filter((i) => i.kind === 'link' && i.meta.review && prKeyOf(i.link));
}

function reviewStatus(r, i) {
  if (!r) return { label: 'not checked yet', level: 'info' };
  if (r.state === 'MERGED') return { label: 'Merged', level: 'done' };
  if (r.state === 'CLOSED') return { label: 'Closed', level: 'done' };
  const seen = [r.myAt, i.meta.seenAt || ''].sort().pop();
  if (!seen) return { label: r.requested ? 'Review requested' : 'Not reviewed yet', level: 'warn' };
  if (r.pushedAt && r.pushedAt > seen) return { label: 'New commits since you looked', level: 'bad' };
  if (r.authorAt && r.authorAt > seen) return { label: 'Author replied', level: 'bad' };
  if (r.requested) return { label: 'Re-review requested', level: 'warn' };
  if (r.myState === 'APPROVED') return { label: 'You approved', level: 'good' };
  return { label: r.myState === 'CHANGES_REQUESTED' ? 'Waiting on author (changes requested)' : 'Waiting on author', level: 'info' };
}

const REVIEW_RANK = { bad: 0, warn: 1, info: 2, good: 3, done: 4 };

function reviewingHtml() {
  const list = reviewItems().map((i) => {
    const r = prRowFor(i.link);
    return { i, r, st: reviewStatus(r, i) };
  }).sort((a, b) => REVIEW_RANK[a.st.level] - REVIEW_RANK[b.st.level] || ((b.r && b.r.updatedAt) || '').localeCompare((a.r && a.r.updatedAt) || ''));
  const open = list.filter((x) => x.st.level !== 'done');
  const done = list.filter((x) => x.st.level === 'done');
  const row = (x) => {
    const n = prKeyOf(x.i.link).split('#')[1];
    const r = x.r;
    const pbusy = !!jobs['pr:' + prKeyOf(x.i.link)];
    const when = r ? [r.pushedAt ? 'pushed ' + ago(r.pushedAt) + ' ago' : '', r.myAt || x.i.meta.seenAt ? 'you ' + ago([r.myAt, x.i.meta.seenAt || ''].sort().pop()) + ' ago' : ''].filter(Boolean).join(' &middot; ') : '';
    return '<div class="prrow review lvl-' + x.st.level + '" data-item="' + x.i.id + '">'
      + '<div class="prname"><a href="' + esc(x.i.link) + '" target="_blank" rel="noopener">' + esc(x.i.title || (r && r.title) || 'PR ' + n) + '</a>'
      + '<span class="fsub">#' + n + (r && r.author ? ' &middot; ' + esc(r.author) : '') + (when ? ' &middot; ' + when : '') + '</span></div>'
      + '<div class="prstate"><span class="prchip ' + x.st.level + '">' + esc(x.st.label) + '</span></div>'
      + '<div class="prinfo">' + (r && r.review ? 'Reviewable: ' + esc(r.review) : '') + '</div>'
      + '<div class="pract">' + (x.st.level !== 'done' ? '<button class="prup" data-action="review-seen" data-id="' + x.i.id + '" title="I\'ve looked at the latest; only flag new changes">Looked</button>' : '')
      + '<button class="prup" data-action="update-pr" data-url="' + esc(x.i.link) + '"' + (pbusy ? ' disabled' : '') + '>' + (pbusy ? 'Updating...' : 'Update') + '</button>'
      + '<button class="x" data-action="review-remove" data-id="' + x.i.id + '" title="Stop tracking">x</button></div>'
      + '</div>';
  };
  return '<div class="review-group" data-review-drop="1"><div class="pr-group-head"><span>Reviewing for others</span><span class="count">' + open.length + '</span>'
    + (open.filter((x) => x.st.level === 'bad').length ? '<span class="fcount bad">' + open.filter((x) => x.st.level === 'bad').length + ' changed</span>' : '') + '</div>'

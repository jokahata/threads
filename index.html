    + '<form class="review-add" data-review-form="1"><input data-focus="review-add" placeholder="+ Paste or drop a PR link you\'re reviewing" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done"></form>'
    + '</div>';
}

function addReview(text) {
  const m = String(text || '').match(/https?:\/\/[^\s<>"]+\/pull\/\d+/);
  const url = m ? m[0] : '';
  const key = prKeyOf(url);
  if (!key) {
    showToast('That is not a pull request link', true);
    return false;
  }
  const have = reviewItems().find((i) => prKeyOf(i.link) === key);
  if (have) {
    showToast('Already in Reviewing', true);
    return false;
  }
  const i = normItem({ id: uid(), threadId: '', projectId: '', kind: 'link', text: '', link: url.replace(/\/(files|commits|checks)\/?.*$/, ''), title: '', meta: { review: true }, position: 0, created: now() });
  items.push(i);
  saveItem(i);
  if (syncAlive()) updatePr(i.link);
  render();
  return true;
}

const FOCUS_CATEGORIES = ['Build', 'Review', 'Investigate', 'Release / Ops', 'On-call', 'Meetings', 'Coordinate / Comms', 'Learn / Admin'];
const FOCUS_PRIORITY = { ssv: 'P0 main - Supervisor Dashboard', 'crossing-s3': 'P1 - Crossing (S3)', 'train-tracks': 'P0 maintenance - Train Tracks', oncall: 'On-call', personal: 'Non-work' };
const FOCUS_SPLIT_MS = 15 * 60000;
const FOCUS_GOAL_MIN = 45;
let focusOpen = false;
let focusDraft = null;
let focusLogging = null;
let focusAudio = null;
let focusTitleTimer = null;
let focusLastTick = '';

function normFocus(r) {
  let pauses = [];
  try {
    pauses = JSON.parse(r.pauses || '[]') || [];
  } catch (e) {
    pauses = [];
  }
  return {
    id: String(r.id), project: String(r.project || ''), thread: String(r.thread || ''), category: String(r.category || 'Build'), start: String(r.start || ''),
    minutes: Number(r.minutes) || 60, pauses: Array.isArray(pauses) ? pauses : [], status: String(r.status || ''), end: String(r.end || ''), note: String(r.note || ''),
    logged: String(r.logged || ''), created: String(r.created || ''), updated: String(r.updated || ''),
  };
}

function focusRecord(b) {
  return Object.assign({}, b, { pauses: JSON.stringify(b.pauses), minutes: String(b.minutes) });
}

function saveFocus(b) {
  b.updated = now();
  queueUpsert('Focus', focusRecord(b));
}

function activeFocus() {
  return focusBlocks.filter((b) => b.status === 'running' || b.status === 'paused' || b.status === 'ended').sort((a, b) => (a.start < b.start ? 1 : -1))[0] || null;
}

function pausedMs(b, t) {
  return b.pauses.reduce((n, p) => n + Math.max(0, (Date.parse(p[1] || '') || t) - Date.parse(p[0])), 0);
}

function focusRemaining(b, t) {
  return b.minutes * 60000 - (t - Date.parse(b.start) - pausedMs(b, t));
}

function focusWorkedMin(b) {
  const end = Date.parse(b.end) || Date.now();
  return Math.max(0, Math.round((end - Date.parse(b.start) - pausedMs(b, end)) / 60000));
}

function fmtClock(ms) {
  const sec = Math.max(0, Math.ceil(ms / 1000));
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  return (h ? h + ':' + pad2(m) : m) + ':' + pad2(sec % 60);
}

function focusSlug(pid) {
  const seen = new Set();
  let p = projectById(pid);
  while (p && !seen.has(p.id)) {
    seen.add(p.id);
    if (p.slug) return p.slug;
    p = projectById(p.parent);
  }
  return '';
}

function focusLabel(b) {
  const p = projectById(b.project);
  const t = threadById(b.thread);
  return [p ? projectPath(p) : '', t ? t.title || 'Untitled' : ''].filter(Boolean).join(' / ') || 'No project';
}

function snap15(d) {
  const m = d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60;
  const r = Math.round(m / 15) * 15;
  const out = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  out.setMinutes(r);
  return out;
}

function hhmm(d) { return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }

function focusRows(b) {
  const segs = [];
  let cur = Date.parse(b.start);
  b.pauses.filter((p) => p[1] && Date.parse(p[1]) - Date.parse(p[0]) >= FOCUS_SPLIT_MS).forEach((p) => {
    segs.push([cur, Date.parse(p[0])]);
    cur = Date.parse(p[1]);
  });
  segs.push([cur, Date.parse(b.end)]);
  const slug = focusSlug(b.project);
  const note = 'Focus block: ' + focusLabel(b) + (b.note ? ' - ' + b.note : '');
  return segs.filter(([a, z]) => z - a >= 8 * 60000).map(([a, z]) => {
    const s0 = snap15(new Date(a));
    let e0 = snap15(new Date(z));
    if (e0 <= s0) e0 = new Date(s0.getTime() + 15 * 60000);
    return { date: ymd(s0), start: hhmm(s0), end: hhmm(e0), category: b.category, priority: FOCUS_PRIORITY[slug] || 'Other good work', project: slug, note };
  });
}

function weekStartYmd() {
  const d = new Date();
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return ymd(d);
}

function focusWeek() {
  const from = weekStartYmd();
  const done = focusBlocks.filter((b) => b.status === 'done' && b.start && ymd(new Date(b.start)) >= from);
  const days = new Set(done.filter((b) => focusWorkedMin(b) >= FOCUS_GOAL_MIN && new Date(b.start).getDay() % 6 !== 0).map((b) => ymd(new Date(b.start))));
  const per = {};
  done.forEach((b) => {
    const k = focusLabel(Object.assign({}, b, { thread: '' }));
    per[k] = (per[k] || 0) + focusWorkedMin(b);
  });
  return { days: days.size, per };
}

function focusChipHtml(b) {
  const w = focusWeek();
  if (!b) return '<button class="focus-chip" data-action="focus-toggle" title="Start a focus block">Focus<span class="focus-week"> ' + w.days + '/5</span></button>';
  if (b.status === 'ended') return '<button class="focus-chip ended" data-action="focus-toggle">Focus done - log it</button>';
  return '<button class="focus-chip ' + b.status + '" data-action="focus-toggle" title="' + esc(focusLabel(b)) + '"><span class="focus-dot"></span><span class="focus-clock">' + fmtClock(focusRemaining(b, Date.now())) + '</span>'
    + '<span class="focus-what"> ' + esc(focusSlug(b.project) || focusLabel(b)) + '</span>' + (b.status === 'paused' ? '<span class="focus-what"> (paused)</span>' : '') + '</button>';
}

function focusOptions(sel) {
  return '<option value="">No project</option>' + projectTreeOrder().filter((x) => x.p.created).map((x) => '<option value="' + x.p.id + '"' + (x.p.id === sel ? ' selected' : '') + '>' + '&nbsp;&nbsp;'.repeat(x.depth) + esc(x.p.name) + '</option>').join('');
}

function focusPanelHtml(b) {
  const w = focusWeek();
  const stats = '<div class="focus-stats"><b>This week: ' + w.days + '/5 days</b> with a ' + FOCUS_GOAL_MIN + '+ min block'
    + Object.keys(w.per).sort((a, z) => w.per[z] - w.per[a]).map((k) => '<div class="focus-stat"><span>' + esc(k) + '</span><span>' + w.per[k] + ' min</span></div>').join('') + '</div>';
  if (!b) {
    const d = focusDraft || (focusDraft = { project: '', thread: '', minutes: 60, category: 'Build' });
    const ths = d.project ? sortedThreads().filter((t) => t.project === d.project && t.status !== 'done') : [];
    return '<div class="focus-title">Focus block</div>'
      + '<label class="focus-field">Project <select data-action="focus-project">' + focusOptions(d.project) + '</select></label>'
      + (ths.length ? '<label class="focus-field">Thread <select data-action="focus-thread"><option value="">Whole project</option>' + ths.map((t) => '<option value="' + t.id + '"' + (t.id === d.thread ? ' selected' : '') + '>' + esc(t.title || 'Untitled') + '</option>').join('') + '</select></label>' : '')
      + '<div class="focus-field">Length <span class="focus-mins">' + [60, 90].map((m) => '<button data-action="focus-mins" data-mins="' + m + '" class="' + (d.minutes === m ? 'on' : '') + '">' + m + '</button>').join('')
      + '<input type="number" min="5" max="240" step="5" data-action="focus-mins-input" data-focus="focus-mins" value="' + d.minutes + '"> min</span></div>'
      + '<label class="focus-field">Category <select data-action="focus-category">' + FOCUS_CATEGORIES.map((c) => '<option' + (c === d.category ? ' selected' : '') + '>' + esc(c) + '</option>').join('') + '</select></label>'
      + '<button class="primary focus-start" data-action="focus-start">Start ' + d.minutes + ' min</button>'
      + '<div class="focus-hint">Then quit Slack and turn on your Deep work Focus.</div>' + stats;
  }
  if (b.status === 'ended') {
    const n = focusDraft && focusDraft.note !== undefined ? focusDraft.note : b.note;
    return '<div class="focus-title">Focus block done</div>'
      + '<div class="focus-sum">' + esc(focusLabel(b)) + ' &middot; ' + focusWorkedMin(b) + ' min &middot; ' + esc(b.category) + '</div>'
      + '<label class="focus-field col">What moved? (optional)<input class="focus-note" data-action="focus-note" data-focus="focus-note" value="' + esc(n) + '" placeholder="e.g. finished the partner contact mock" autocomplete="off"></label>'
      + '<div class="focus-row"><button class="primary" data-action="focus-log">Log to time sheet</button><button data-action="focus-discard">Discard</button></div>' + stats;
  }
  return '<div class="focus-title">' + (b.status === 'paused' ? 'Paused' : 'Focusing') + '</div>'
    + '<div class="focus-big">' + fmtClock(focusRemaining(b, Date.now())) + '</div>'
    + '<div class="focus-sum">' + esc(focusLabel(b)) + ' &middot; ' + b.minutes + ' min &middot; ' + esc(b.category) + '</div>'
    + '<div class="focus-row">' + (b.status === 'paused' ? '<button class="primary" data-action="focus-resume">Resume</button>' : '<button data-action="focus-pause">Pause</button>')
    + '<button data-action="focus-stop">Stop and log</button><button class="danger" data-action="focus-cancel">Cancel</button></div>'
    + '<div class="focus-hint">Pauses of 15 min or more are left out of the time sheet.</div>' + stats;
}

function renderFocus() {
  const chip = document.getElementById('focus');
  const panel = document.getElementById('focusPanel');
  if (!FOCUS_ENABLED) {
    chip.innerHTML = '';
    panel.className = 'hidden';
    return;
  }
  const b = activeFocus();
  chip.innerHTML = focusChipHtml(b);
  panel.className = focusOpen ? '' : 'hidden';
  panel.innerHTML = focusOpen ? focusPanelHtml(b) : '';
}

function focusChime() {
  try {
    const ctx = focusAudio || new (window.AudioContext || window.webkitAudioContext)();
    focusAudio = ctx;
    [0, 0.35, 0.7].forEach((t, n) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.frequency.value = [660, 880, 1320][n];
      g.gain.setValueAtTime(0.0001, ctx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.3);
      o.connect(g).connect(ctx.destination);
      o.start(ctx.currentTime + t);
      o.stop(ctx.currentTime + t + 0.32);
    });
  } catch (e) {
    return;
  }
}

function focusAlert(b) {
  focusChime();
  try {
    if (window.Notification && Notification.permission === 'granted') new Notification('Focus block done', { body: focusLabel(b) });
  } catch (e) {
    focusChime();
  }
  clearInterval(focusTitleTimer);
  const base = document.title;
  let on = false;
  focusTitleTimer = setInterval(() => {
    on = !on;
    document.title = on ? 'Focus done' : base;
  }, 1000);
  setTimeout(() => {
    clearInterval(focusTitleTimer);
    document.title = base;
  }, 60000);
}

function focusStart() {
  const d = focusDraft || {};
  if (activeFocus()) return;
  const minutes = Math.max(5, Math.min(240, Number(d.minutes) || 60));
  const b = normFocus({ id: uid(), project: d.project, thread: d.thread, category: d.category || 'Build', start: new Date().toISOString(), minutes, pauses: '[]', status: 'running', created: now() });
  focusBlocks.push(b);
  saveFocus(b);
  focusDraft = null;
  focusOpen = false;
  try {
    focusAudio = focusAudio || new (window.AudioContext || window.webkitAudioContext)();
    if (window.Notification && Notification.permission === 'default') Notification.requestPermission().catch(() => {});
  } catch (e) {
    focusAudio = null;
  }
  showToast('Focus started: ' + minutes + ' min. Quit Slack and turn on your Deep work Focus.', true);
  render();
}

function focusFinish(b, at) {
  const open = b.pauses.find((p) => !p[1]);
  let end = at;
  if (open) {
    if (b.status === 'paused' && Date.parse(open[0]) < at) end = Date.parse(open[0]);
    b.pauses = b.pauses.filter((p) => p !== open);
  }
  b.end = new Date(end).toISOString();
  b.status = 'ended';
  saveFocus(b);
}

function focusTick() {
  if (!FOCUS_ENABLED) return;
  const b = activeFocus();
  const t = Date.now();
  if (b && b.status === 'running' && focusRemaining(b, t) <= 0) {
    focusFinish(b, Date.parse(b.start) + b.minutes * 60000 + pausedMs(b, t));
    focusOpen = true;
    focusAlert(b);
    return render();
  }
  if (b && b.status !== 'ended') {
    const text = fmtClock(focusRemaining(b, t));
    if (text !== focusLastTick) {
      focusLastTick = text;
      document.querySelectorAll('#focus .focus-clock, #focusPanel .focus-big').forEach((el) => { el.textContent = text; });
    }
  }
  const todo = focusBlocks.find((x) => x.status === 'done' && !x.logged);
  if (todo && !focusLogging && api.logFocus && !pending.size && !inFlight && !offline) logFocusBlock(todo);
}

async function logFocusBlock(b) {
  focusLogging = b.id;
  try {
    const at = await withTimeout(api.logFocus(focusRecord(b), focusRows(b)), 30000);
    b.logged = String(at || now());
    saveFocus(b);
    showToast('Logged to your time sheet', true);
    render();
  } catch (e) {
    setTimeout(() => { if (focusLogging === b.id) focusLogging = null; }, 60000);
    return;
  }
  focusLogging = null;
}

function focusAction(action, el) {
  const b = activeFocus();
  if (action === 'focus-toggle') {
    focusOpen = !focusOpen;
    return render();
  }
  if (action === 'focus-mins') {
    focusDraft.minutes = Number(el.dataset.mins);
    return render();
  }
  if (action === 'focus-start') return focusStart();
  if (!b) return;
  if (action === 'focus-pause' && b.status === 'running') {
    b.pauses.push([new Date().toISOString(), '']);
    b.status = 'paused';
  } else if (action === 'focus-resume' && b.status === 'paused') {
    const open = b.pauses.find((p) => !p[1]);
    if (open) open[1] = new Date().toISOString();
    b.status = 'running';
  } else if (action === 'focus-stop') {
    focusFinish(b, Date.now());
  } else if (action === 'focus-cancel') {
    if (!confirm('Cancel this focus block? Nothing is logged.')) return;
    b.status = 'cancelled';
    b.end = new Date().toISOString();
    focusOpen = false;
  } else if (action === 'focus-log') {
    b.note = focusDraft && focusDraft.note !== undefined ? focusDraft.note.trim() : b.note;
    b.status = 'done';
    focusDraft = null;
    focusOpen = false;
  } else if (action === 'focus-discard') {
    if (!confirm('Discard this block without logging it?')) return;
    b.status = 'cancelled';
    focusDraft = null;
    focusOpen = false;
  } else {
    return;
  }
  saveFocus(b);
  render();
}

setInterval(focusTick, 1000);

let docView = null;
const docText = {};

function normDoc(r) {
  let sids = [];
  try {
    sids = JSON.parse(r.sessions || '[]') || [];
  } catch (e) {
    sids = [];
  }
  return { raw: r, key: String(r.key), path: String(r.path || ''), title: String(r.title || ''), sessions: sids, mtime: String(r.mtime || ''), size: Number(r.size) || 0, source: String(r.source || '') };
}

function docByKey(k) { return docs.find((d) => d.key === k) || null; }
function docsBySession(sid) { return docs.filter((d) => d.sessions.includes(sid)); }
function HOME_GUESS() { const d = docs.find((x) => /^\/home\/[^/]+\//.test(x.path)); return d ? d.path.match(/^\/home\/[^/]+/)[0] : ''; }
function tildePath(p) { const h = HOME_GUESS(); return h && p.startsWith(h + '/') ? '~' + p.slice(h.length) : p; }

function docSessionLabel(d) {
  const x = d.sessions.map((sid) => sessionByKey(sid)).find(Boolean);
  return x ? x.label || x.name : d.sessions.length ? 'session ' + d.sessions[0].slice(0, 8) : '';
}

function mdInline(t) {
  const codes = [];
  let out = esc(t).replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
  out = out.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, (m, txt, u) => '<a href="' + u + '" target="_blank" rel="noopener">' + txt + '</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, (m, pre, u) => pre + '<a href="' + u + '" target="_blank" rel="noopener">' + esc(shortUrl(u.replace(/&amp;/g, '&'))) + '</a>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[^*\w])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>').replace(/~~([^~]+)~~/g, '<s>$1</s>');
  return out.replace(/\u0000(\d+)\u0000/g, (m, n) => '<code>' + codes[Number(n)] + '</code>');
}

function mdToHtml(src) {
  const lines = String(src || '').replace(/\r\n?/g, '\n').split('\n');
  const out = [];
  let i = 0;
  const isTableSep = (l) => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
  const cells = (l) => l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map((c) => c.trim());
  while (i < lines.length) {
    const l = lines[i];
    let m;
    if ((m = l.match(/^\s*(```|~~~)\s*([\w+-]*)/))) {
      const fence = m[1];
      const body = [];
      i++;
      while (i < lines.length && !lines[i].trim().startsWith(fence)) body.push(lines[i++]);
      i++;
      out.push('<pre><code>' + esc(body.join('\n')) + '</code></pre>');
      continue;
    }
    if (!l.trim()) { i++; continue; }
    if ((m = l.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/))) { out.push('<h' + m[1].length + '>' + mdInline(m[2]) + '</h' + m[1].length + '>'); i++; continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) { out.push('<hr>'); i++; continue; }
    if (l.includes('|') && i + 1 < lines.length && isTableSep(lines[i + 1])) {
      const head = cells(l);
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].includes('|') && lines[i].trim()) rows.push(cells(lines[i++]));
      out.push('<div class="md-table"><table><thead><tr>' + head.map((c) => '<th>' + mdInline(c) + '</th>').join('') + '</tr></thead><tbody>'
        + rows.map((r) => '<tr>' + r.map((c) => '<td>' + mdInline(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>');
      continue;
    }
    if (/^\s*>/.test(l)) {
      const body = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) body.push(lines[i++].replace(/^\s*>\s?/, ''));
      out.push('<blockquote>' + mdToHtml(body.join('\n')) + '</blockquote>');
      continue;
    }
    if (/^\s*([-*+]|\d+[.)])\s+/.test(l)) {
      const stack = [];
      let html = '';
      while (i < lines.length && (/^\s*([-*+]|\d+[.)])\s+/.test(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && stack.length))) {
        const li = lines[i];
        const lm = li.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
        if (!lm) { html += ' ' + mdInline(li.trim()); i++; continue; }
        const depth = Math.floor(lm[1].replace(/\t/g, '  ').length / 2);
        const tag = /\d/.test(lm[2]) ? 'ol' : 'ul';
        while (stack.length > depth + 1) html += '</li></' + stack.pop() + '>';
        if (stack.length === depth + 1 && stack[depth] !== tag) html += '</li></' + stack.pop() + '>';
        if (stack.length < depth + 1) { stack.push(tag); html += '<' + tag + '>'; } else html += '</li>';
        const task = lm[3].match(/^\[([ xX])\]\s+(.*)$/);
        html += '<li>' + (task ? '<input type="checkbox" disabled' + (task[1] !== ' ' ? ' checked' : '') + '> ' + mdInline(task[2]) : mdInline(lm[3]));
        i++;
      }
      while (stack.length) html += '</li></' + stack.pop() + '>';
      out.push(html);
      continue;
    }
    const para = [];
    while (i < lines.length && lines[i].trim() && !/^(#{1,6}\s|\s*(```|~~~)|\s*>|\s*([-*+]|\d+[.)])\s+)/.test(lines[i]) && !(lines[i].includes('|') && i + 1 < lines.length && isTableSep(lines[i + 1]))) para.push(lines[i++]);
    out.push('<p>' + para.map(mdInline).join('<br>') + '</p>');
  }
  return out.join('\n');
}

function depDone(id) {
  const t = threadById(id);
  if (t) {
    const ts = items.filter((i) => i.threadId === t.id && i.kind === 'task');
    return t.status === 'done' || (ts.length > 0 && ts.every((i) => i.done));
  }
  const i = itemById(id);
  return !i || i.done;
}

function boardColumns(pid) {
  const ths = threads.filter((t) => t.project === pid);
  const ids = new Set(ths.map((t) => t.id));
  const owner = (id) => (ids.has(id) ? id : (itemById(id) || {}).threadId);
  const depth = {};
  const visit = (t, seen) => {
    if (depth[t.id] !== undefined) return depth[t.id];
    if (seen.has(t.id)) return 0;
    seen.add(t.id);
    const ups = new Set();
    (t.after || []).forEach((d) => { const o = owner(d); if (o && o !== t.id && ids.has(o)) ups.add(o); });
    items.filter((i) => i.threadId === t.id && i.kind === 'task').forEach((i) => (i.meta.after || []).forEach((d) => { const o = owner(d); if (o && o !== t.id && ids.has(o)) ups.add(o); }));
    depth[t.id] = ups.size ? 1 + Math.max(...[...ups].map((u) => visit(threadById(u), seen))) : 0;
    return depth[t.id];
  };
  ths.forEach((t) => visit(t, new Set()));
  return ths.sort((a, b) => depth[a.id] - depth[b.id] || a.position - b.position);
}

function drawBoardArrows() {
  const board = document.querySelector('.board');
  if (!board) return;
  const svg = board.querySelector('.board-arrows');
  const box = board.getBoundingClientRect();
  svg.setAttribute('width', board.scrollWidth);
  svg.setAttribute('height', board.scrollHeight);
  const rect = (id) => {
    const el = board.querySelector('[data-node="' + id + '"]');
    if (!el) return null;
    const r = el.getBoundingClientRect();
    return { l: r.left - box.left + board.scrollLeft, r: r.right - box.left + board.scrollLeft, t: r.top - box.top, b: r.bottom - box.top, col: el.closest('.bcol') };
  };
  const paths = [];
  let lane = 0;
  const colRect = (el) => {
    const r = el.getBoundingClientRect();
    return { l: r.left - box.left + board.scrollLeft, r: r.right - box.left + board.scrollLeft };
  };
  const edge = (from, to, done) => {
    const a = rect(from);
    const z = rect(to);
    if (!a || !z) return;
    let d;
    if (a.col === z.col) {
      const x = (Math.max(a.l, z.l) + Math.min(a.r, z.r)) / 2;
      d = 'M' + x + ' ' + a.b + ' L' + x + ' ' + (z.t - 2);
    } else {
      const k = lane++;
      const ca = colRect(a.col);
      const cz = colRect(z.col);
      const y1 = Math.min((a.t + a.b) / 2, a.t + 20);
      const y2 = Math.min((z.t + z.b) / 2, z.t + 20);
      const jog = ((k % 5) - 2) * 3;
      const gx1 = ca.r + 17 + jog;
      const gx2 = cz.l - 17 + jog;
      const adjacent = gx2 - gx1 < 40;
      const pts = adjacent
        ? [[a.r, y1], [gx1, y1], [gx1, y2], [z.l - 2, y2]]
        : [[a.r, y1], [gx1, y1], [gx1, 8 + (k % 6) * 4], [gx2, 8 + (k % 6) * 4], [gx2, y2], [z.l - 2, y2]];
      d = 'M' + pts.map((q) => q[0] + ' ' + q[1]).join(' L');
    }
    paths.push('<path d="' + d + '" class="' + (done ? 'met' : '') + '" marker-end="url(#barrow)"/>');
  };
  board.querySelectorAll('.bstage[data-node]').forEach((el) => {
    const t = threadById(el.dataset.node);
    (t.after || []).forEach((d) => edge(d, t.id, depDone(d)));
    items.filter((i) => i.threadId === t.id && i.kind === 'task').forEach((i) => (i.meta.after || []).forEach((d) => edge(d, i.id, depDone(d))));
  });
  svg.innerHTML = '<defs><marker id="barrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z"/></marker></defs>' + paths.join('');
}

function importBoard(id) {
  const r = imports.find((x) => x.id === id);
  if (!r) return;
  let b;
  try {
    b = JSON.parse(r.json);
  } catch (e) {
    return showToast('That board could not be read', true);
  }
  const parent = boardImportParent[id] || '';
  const used = new Set(projects.map((p) => p.color));
  const pc = projectById(parent);
  const p = { id: uid(), name: b.project || b.title || 'Board', color: pc ? pc.color : PALETTE.find((c) => !used.has(c)) || PALETTE[0], position: childProjects(parent).reduce((m, x) => Math.max(m, x.position), -1) + 1,
    created: now(), updated: now(), parent, slug: b.slug && !projects.some((x) => x.slug === b.slug) ? b.slug : '', import: id };
  projects.push(p);
  saveProject(p);
  const keyToId = {};
  const stages = b.stages || [];
  stages.forEach((st) => {
    keyToId[st.key] = uid();
    (st.items || []).forEach((it) => { keyToId[it.key] = uid(); });
  });
  const base = threads.reduce((m, t) => Math.max(m, t.position), -1) + 1;
  stages.forEach((st, n) => {
    const t = normThread({ id: keyToId[st.key], title: st.title, status: 'active', position: base + n, created: now(), updated: now(), section: n === 0 ? 'now' : 'later', project: p.id });
    t.after = (st.needs || []).map((k) => keyToId[k]).filter(Boolean);
    threads.push(t);
    saveThread(t);
    (st.items || []).forEach((it, k) => {
      const meta = {};
      if (it.group) meta.group = it.group;
      const after = (it.after || []).map((x) => keyToId[x]).filter(Boolean);
      if (after.length) meta.after = after;
      const i = normItem({ id: keyToId[it.key], threadId: t.id, kind: 'task', text: it.title + (it.note ? '\n' + it.note : ''), done: it.done ? 'TRUE' : 'FALSE', link: it.link || '', refs: '', position: k, created: now(), meta });
      items.push(i);
      saveItem(i);
    });
  });
  ui.boards.add(p.id);
  saveUi();
  showToast('Imported "' + p.name + '": ' + stages.length + ' threads', true);
  location.hash = '#project=' + p.id;
  render();
}

const EDIT_FIELDS = { Items: ['text', 'link', 'done', 'due'], Threads: ['title', 'status'] };

function applyEdits(list) {
  let n = 0;
  list.forEach((e) => {
    const allowed = EDIT_FIELDS[e.table];
    const rec = e.table === 'Items' ? itemById(String(e.recordId)) : e.table === 'Threads' ? threadById(String(e.recordId)) : null;
    if (!allowed || !rec || !e.created || String(rec.updated || '') >= String(e.created)) return;
    let fields = {};
    try {
      fields = JSON.parse(e.fields || '{}') || {};
    } catch (err) {
      return;
    }
    const keys = Object.keys(fields).filter((k) => allowed.includes(k));
    if (!keys.length) return;
    keys.forEach((k) => {
      rec[k] = k === 'done' ? isTrue(fields[k]) : k === 'status' && !STATUSES.includes(fields[k]) ? rec[k] : String(fields[k]);
    });
    if (e.table === 'Items') saveItem(rec);
    else saveThread(rec);
    if (String(rec.updated) < String(e.created)) {
      rec.updated = String(e.created);
      if (e.table === 'Items') queueUpsert('Items', rec);
      else queueUpsert('Threads', rec);
    }
    n++;
  });
  if (n) {
    showToast('Applied ' + n + ' change' + (n === 1 ? '' : 's') + ' from Claude', true);
    render();
  }
}

      + '<span class="scratch-line"></span><span class="scratch-line-label">priority above</span><span class="scratch-line"></span></div>';
  }
  const html = itemHtml(i);
  if (editingItem === i.id) return html;
  return html.replace('<div class="item k-scratch', '<div class="item k-scratch' + (n ? ' pri' : ''))
    .replace('<span class="grip"', (n ? '<span class="scratch-n">' + n + '</span>' : '') + '<span class="grip"')
    .replace('<button class="x" data-action="delete-item"', (i.done ? '' : '<button class="scratch-pri' + (n ? ' on' : '') + '" data-action="scratch-pri" data-id="' + i.id + '" title="' + (n ? 'Remove from priority' : 'Make priority') + '">&#9733;</button>') + scratchMoveHtml(i) + '<button class="x" data-action="delete-item"');
}

const LIST_KINDS = { check: 'Checklist', keep: 'Keep list', rated: 'Rated' };

function normList(r) {
  let meta = {};
  try {
    meta = typeof r.meta === 'object' && r.meta ? r.meta : JSON.parse(r.meta || '{}') || {};
  } catch (e) {
    meta = {};
  }
  return { id: String(r.id), name: String(r.name || ''), kind: LIST_KINDS[r.kind] ? String(r.kind) : 'check', position: num(r.position, 0), created: r.created || '', updated: r.updated || '', meta };
}

function listById(id) { return lists.find((l) => l.id === id) || null; }
function saveList(l) { l.updated = now(); queueUpsert('Lists', Object.assign({}, l, { meta: JSON.stringify(l.meta || {}) })); }

function addEntry(listId, text) {

  const l = listById(listId);
  const sibs = itemsOf(listId, 'entry');
  const i = normItem({ id: uid(), threadId: listId, projectId: '', kind: 'entry', text, done: false, position: (l && l.kind === 'check' ? sibs.reduce((m, x) => Math.max(m, x.position), -1) + 1 : sibs.reduce((m, x) => Math.min(m, x.position), 1) - 1), created: now() });

function money(v) {
  return '$' + Math.round(Number(v) || 0).toLocaleString('en-US');
}

function spendInfo() {
  if (!syncInfo.spendMonth) return null;
  const month = Number(syncInfo.spendMonth) || 0;
  const limit = Number(syncInfo.spendLimit) || 0;
  const pace = Number(syncInfo.spendProjected) || 0;
  const level = limit && (month >= limit * 0.9 || pace > limit) ? 'bad' : limit && pace > limit * 0.8 ? 'warn' : 'ok';
  const reset = syncInfo.spendReset ? new Date(syncInfo.spendReset + 'T00:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : '';
  let daily = {};
  try {
    daily = JSON.parse(syncInfo.spendDaily || '{}') || {};
  } catch (e) {
    daily = {};
  }
  return { month, limit, pace, level, reset, today: Number(syncInfo.spendToday) || 0, daily, left: Math.max(0, limit - month) };
}

function spendDetail(x) {
  return 'Claude Code spend this month: ' + money(x.month) + ' of ' + money(x.limit) + ' (' + money(x.left) + ' left)\n'
    + 'Today: ' + money(x.today) + '\nOn pace for ' + money(x.pace) + ' by the end of the month\nResets ' + x.reset
    + (syncInfo.lastSpend ? '\nEstimated by ccusage on the VDI, ' + ago(syncInfo.lastSpend) + ' ago' : '')
    + (syncInfo.spendError ? '\nLast check failed: ' + syncInfo.spendError : '');
}

  el.className = 'spend ' + x.level;

  el.innerHTML = '<span class="spend-label">Claude</span> ' + money(x.month) + '<span class="spend-of"> / ' + money(x.limit) + '</span>'
    + '<span class="spend-bar"><span style="width:' + Math.min(100, x.limit ? (x.month / x.limit) * 100 : 0).toFixed(1) + '%"></span><span class="spend-pace" style="left:' + Math.min(100, x.limit ? (x.pace / x.limit) * 100 : 0).toFixed(1) + '%"></span></span>';
}

function syncAlive() {
  const at = Date.parse(syncInfo.heartbeat || '');
  return !isNaN(at) && Date.now() - at < 3 * 60000;
}

function syncLongStale() {
  const at = Date.parse(syncInfo.heartbeat || '');
  return !isNaN(at) && Date.now() - at >= 30 * 60000;
}

function syncStale() {
  const at = Date.parse(syncInfo.heartbeat || '');
  return !isNaN(at) && Date.now() - at >= 5 * 60000;
}

function trackSession(key, to) {

    items.push(i);
  }
  i.meta = Object.assign({}, i.meta, { dismissed: false });
  attachLink(i.id, to);
}

function dismissSession(key) {
  const x = sessionByKey(key);
  const sid = x ? x.sid : String(key).toLowerCase();

function ignoreEffort(slug) {
  const i = normItem({ id: uid(), kind: 'link', text: '', link: 'slug:' + slug, title: '', meta: { dismissed: true, slug }, position: 0, created: now() });
  items.push(i);
  saveItem(i);
}

function adoptEffort(slug, how) {
  const c = coordThreads.find((x) => x.slug === slug);
  if (!c || slugOwnerItem(slug)) return render();
  if (how === 'new-project') {
    const used = new Set(projects.map((p) => p.color));
    const top = childProjects('');
    const p = { id: uid(), name: slug, color: PALETTE.find((col) => !used.has(col)) || PALETTE[projects.length % PALETTE.length], position: top.reduce((m, q) => Math.min(m, q.position), 1) - 1, created: now(), updated: '', parent: '', slug };
    projects.push(p);
    saveProject(p);
    showToast('Created project #' + slug + '. Rename it with the pencil.', true);
  } else if (how === 'new-thread') {
    const min = threads.filter((t) => t.section === 'now').reduce((m, t) => Math.min(m, t.position), 1);
    const t = normThread({ id: uid(), title: slug, status: 'active', position: min - 1, created: now(), section: 'now', slug });
    threads.push(t);
    saveThread(t);
    showToast('Created thread #' + slug + ' in Now', true);
  } else {
    const [kind, id] = how.split(':');
    const target = kind === 'p' ? projectById(id) : threadById(id);
    if (!target || target.slug) return render();
    target.slug = slug;
    if (kind === 'p') saveProject(target);
    else saveThread(target);
    showToast('#' + slug + ' now points at "' + (target.name || target.title) + '"', true);
  }
  render();
}

function copyText(text) {
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try {
      ok = document.execCommand('copy');
    } catch (e) {
      ok = false;
    }
    ta.remove();
    return ok;
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).then(() => true, () => fallback());
  }
  return Promise.resolve(fallback());
}

function copySession(key) {
  const x = sessionByKey(key);
  const cmd = 'coord open ' + (x ? x.id : String(key)).slice(0, 8).toLowerCase();
  copyText(cmd).then((ok) => showToast((ok ? 'Copied: ' : 'Copy failed, run: ') + cmd, true));
}

function pruneRequests() {
  const cut = Date.now() - 10 * 60000;
  requests.filter((r) => Date.parse(r.created) < cut).forEach((r) => {
    requests = requests.filter((x) => x !== r);
    queueDelete('Requests', r.id);
  });
}

function removeItems(list, threadList) {
  threadList = threadList || [];
  const saved = { items: list.map((i) => Object.assign({}, i)), threads: threadList.map((t) => Object.assign({}, t)) };
  undoAction = () => {
    saved.threads.forEach((t) => { threads.push(t); queueUpsert('Threads', t); });
    saved.items.forEach((i) => { items.push(i); queueUpsert('Items', i); });
  };
  const ids = new Set(list.map((i) => i.id));
  items = items.filter((i) => !ids.has(i.id));
  list.forEach((i) => queueDelete('Items', i.id));
  const tids = new Set(threadList.map((t) => t.id));
  threads = threads.filter((t) => !tids.has(t.id));
  threadList.forEach((t) => queueDelete('Threads', t.id));
  const word = (k) => ({ entry: 'item', scratch: 'item' }[k] || k);
  const what = threadList.length ? 'Deleted thread "' + (threadList[0].title || 'Untitled') + '"' : 'Deleted ' + (list.length === 1 ? (list[0].kind === 'entry' || list[0].kind === 'scratch' ? '1 item' : word(list[0].kind)) : list.length + ' items');
  showToast(what);
  render();
}

function mergeThread(srcId, dstId) {
  const src = threadById(srcId);
  const dst = threadById(dstId);
  if (!src || !dst || src === dst) return;
  const name = (t) => '"' + (t.title || 'Untitled') + '"';
  const slugNote = src.slug && dst.slug && src.slug !== dst.slug ? '\n\nSessions named for ' + src.slug + ' will no longer attach; ' + dst.slug + ' is kept.' : '';
  if (!confirm('Merge ' + name(src) + ' into ' + name(dst) + '?\n\nIts subtasks, notes, decisions and links move to ' + name(dst) + ', then ' + name(src) + ' is removed. You can undo.' + slugNote)) return;
  const moving = items.filter((i) => i.threadId === srcId);
  const referencing = items.filter((i) => i.refs.includes(srcId));
  const before = new Map([...moving, ...referencing].map((i) => [i.id, Object.assign({}, i, { refs: i.refs.slice() })]));
  const savedSrc = Object.assign({}, src);
  const savedDst = Object.assign({}, dst);
  const dstLinks = new Set(threadLinks(dstId).map((i) => i.link));
  const dupes = moving.filter((i) => i.kind === 'link' && dstLinks.has(i.link));
  const keep = moving.filter((i) => !dupes.includes(i));
  Object.keys(KINDS).concat('link').forEach((kind) => {
    const base = items.filter((i) => i.threadId === dstId && i.kind === kind).reduce((m, i) => Math.max(m, Number(i.position) + 1), 0);
    keep.filter((i) => i.kind === kind).sort((a, b) => a.position - b.position).forEach((i, n) => { i.threadId = dstId; i.position = base + n; });
  });
  keep.forEach((i) => { i.refs = i.refs.filter((r) => r !== srcId && r !== dstId); });
  referencing.forEach((i) => { i.refs = [...new Set(i.refs.map((r) => (r === srcId ? dstId : r)))].filter((r) => r !== i.threadId); });
  new Set([...keep, ...referencing]).forEach(saveItem);
  const dupeIds = new Set(dupes.map((i) => i.id));
  items = items.filter((i) => !dupeIds.has(i.id));
  dupes.forEach((i) => queueDelete('Items', i.id));
  dst.due = dst.due || src.due;
  dst.start = dst.start || src.start;
  dst.project = dst.project || src.project;
  dst.slug = dst.slug || src.slug;
  dst.star = dst.star || src.star;
  saveThread(dst);
  threads = threads.filter((t) => t.id !== srcId);
  queueDelete('Threads', srcId);
  ui.expanded.delete(srcId);
  ui.expanded.add(dstId);
  saveUi();
  undoAction = () => {
    threads.push(savedSrc);
    queueUpsert('Threads', savedSrc);
    Object.assign(dst, savedDst);
    queueUpsert('Threads', dst);
    before.forEach((old, id) => {
      const cur = itemById(id);
      if (cur) Object.assign(cur, old);
      else items.push(old);
      queueUpsert('Items', cur || old);
    });
  };
  showToast('Merged ' + name(src) + ' into ' + name(dst));
  render();
}

function mergeOptionsHtml(t) {
  const others = sortedThreads().filter((x) => x.id !== t.id);
  if (!others.length) return '';
  const opt = (x) => '<option value="' + x.id + '">' + esc(x.title || 'Untitled') + '</option>';
  const open = others.filter((x) => x.status !== 'done');
  const done = others.filter((x) => x.status === 'done');
  return '<select class="merge-into" data-action="merge-into" title="Move everything from this thread into another one"><option value="">Merge into...</option>'
    + open.map(opt).join('') + (done.length ? '<optgroup label="Done">' + done.map(opt).join('') + '</optgroup>' : '') + '</select>';
}

function undoDelete() {
  if (!undoAction) return;
  const fn = undoAction;
  undoAction = null;
  fn();
  hideToast();
  render();
}

function showToast(msg, info) {
  document.getElementById('toastMsg').textContent = msg;
  document.getElementById('undo').style.display = info ? 'none' : '';
  document.getElementById('toast').style.display = 'flex';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 8000);
}

function hideToast() { document.getElementById('toast').style.display = 'none'; }

function renumber(list, save) {
  list.forEach((rec, idx) => {
    if (rec.position !== idx) {
      rec.position = idx;
      save(rec);
    }
  });
}

function moveThread(id, targetId, before) {
  const t = threadById(id);
  const target = threadById(targetId);
  if (!t || !target) return;
  const order = sortedThreads().filter((x) => x !== t);
  let idx = order.indexOf(target);
  if (!before) idx += 1;
  order.splice(idx, 0, t);
  setSection(t, target.section, order);
}

function moveThreadToSection(id, section) {
  const t = threadById(id);
  if (!t) return;
  const order = sortedThreads().filter((x) => x !== t);
  const first = order.findIndex((x) => SECTION_IDS.indexOf(x.section) >= SECTION_IDS.indexOf(section));
  order.splice(first < 0 ? order.length : first, 0, t);
  setSection(t, section, order);
}

function setSection(t, section, order) {
  const changed = t.section !== section;
  t.section = section;
  renumber(order, (r) => queueUpsert('Threads', r));
  if (changed) saveThread(t);
  render();
}

function moveItem(id, dest) {
  const i = itemById(id);
  if (!i) return;
  const fromThread = i.threadId;
  const fromKind = i.kind;
  if (dest.kind === 'scratch' && dest.threadId) dest = Object.assign({}, dest, { kind: 'task' });
  if (dest.kind !== 'entry' && dest.threadId && listById(dest.threadId)) dest = Object.assign({}, dest, { kind: 'entry' });
  if (dest.kind === 'entry' && !listById(dest.threadId)) dest = Object.assign({}, dest, { kind: 'task' });
  if (i.meta.divider && (dest.threadId || dest.kind !== 'scratch')) return render();
  const list = itemsOf(dest.threadId, dest.kind).filter((x) => x !== i);
  let idx;
  if (dest.targetId) {
    idx = list.findIndex((x) => x.id === dest.targetId);
    if (idx < 0) idx = list.length;
    else if (!dest.before) idx += 1;
  } else {
    idx = NEWEST_FIRST[dest.kind] ? 0 : list.length;
  }
  list.splice(idx, 0, i);
  const moved = i.threadId !== dest.threadId || i.kind !== dest.kind;
  i.threadId = dest.threadId;
  i.kind = dest.kind;
  if (dest.kind !== 'task' && dest.kind !== 'scratch' && dest.kind !== 'entry') i.done = false;
  renumber(list, (r) => queueUpsert('Items', r));
  if (moved) {
    saveItem(i);
    renumber(itemsOf(fromThread, fromKind), (r) => queueUpsert('Items', r));
  }
  render();
}

function clearDrop() {
  if (dropMark) dropMark.el.classList.remove('drop-before', 'drop-after', 'drop-into', 'tl-dropping');
  dropMark = null;
}

function markDrop(el, cls, info) {
  if (!(dropMark && dropMark.el === el && dropMark.cls === cls)) {
    clearDrop();
    el.classList.add(cls);
  }
  dropMark = { el, cls, info };
  if (info.date) {
    const hover = el.querySelector('.tl-hover');
    hover.style.setProperty('--i', dayDiff(el.dataset.start, info.date));
    hover.firstChild.textContent = fmtDay(info.date);
  }
}

function dateAtX(grid, x) {
  const track = grid.querySelector('.tl-daysrow .tl-track');
  const r = track.getBoundingClientRect();
  const days = Number(grid.dataset.days);
  const idx = Math.floor((x - r.left) / (r.width / days));
  return idx >= 0 && idx < days ? addDays(grid.dataset.start, idx) : null;
}

function dropTarget(e) {
  if (!drag) return null;
  const grid = e.target.closest('.tl-grid');
  if (grid) {
    if (e.target.closest('.tl-label')) return null;
    if (drag.type === 'item') {
      const i = itemById(drag.id);
      if (!i || i.kind !== 'task') return null;
    }
    const date = dateAtX(grid, e.clientX);
    return date ? { el: grid, cls: 'tl-dropping', info: { date } } : null;
  }
  if (drag.type === 'project') {
    const topHead = e.target.closest('.projects-head');
    if (topHead) return { el: topHead, cls: 'drop-into', info: { projectParent: '' } };
    let card = e.target.closest('.project');
    const list = e.target.closest('.projects');
    if (!card && list) {
      const cards = [...list.querySelectorAll(':scope > .project')];
      card = cards.find((c) => e.clientY < c.getBoundingClientRect().bottom) || cards[cards.length - 1];
      if (!card || card.dataset.project === drag.id) return null;
      const before = e.clientY < card.getBoundingClientRect().top;
      return { el: card, cls: before ? 'drop-before' : 'drop-after', info: { projectTarget: card.dataset.project, before } };
    }
    if (!card || card.dataset.project === drag.id || subtreeIds(drag.id).has(card.dataset.project)) return null;
    const headEl = card.querySelector(':scope > .project-head');
    if (headEl) {
      const r = headEl.getBoundingClientRect();
      if (e.clientY < r.top + r.height * 0.35) return { el: card, cls: 'drop-before', info: { projectTarget: card.dataset.project, before: true } };
      if (e.clientY > r.bottom - r.height * 0.35) return { el: card, cls: 'drop-after', info: { projectTarget: card.dataset.project, before: false } };
    }
    return { el: card, cls: 'drop-into', info: { projectParent: card.dataset.project } };
  }
  if (drag.type === 'thread') {
    const card = e.target.closest('.project');
    if (card) {
      const t = threadById(drag.id);
      if (!t || t.project === card.dataset.project || editingProject === card.dataset.project) return null;
      return { el: card, cls: 'drop-into', info: { project: card.dataset.project } };
    }
    const sec = e.target.closest('.thread');
    if (sec && sec.dataset.thread !== drag.id) {
      const r = sec.querySelector('.row').getBoundingClientRect();
      const before = e.clientY < r.top + r.height / 2;
      return { el: sec, cls: before ? 'drop-before' : 'drop-after', info: { targetId: sec.dataset.thread, before } };
    }
    const sectionEl = !sec && e.target.closest('.section');
    if (sectionEl) return { el: sectionEl.querySelector('.section-head') || sectionEl, cls: 'drop-into', info: { section: sectionEl.dataset.section } };
    const laneEl = !sec && e.target.closest('[data-drop-section]');
    if (laneEl) return { el: laneEl.querySelector('.lane-rail, .lane-head'), cls: 'drop-into', info: { section: laneEl.dataset.dropSection } };
    return null;
  }
  const dragged = itemById(drag.id);
  if ((dragged && dragged.kind === 'link') || String(drag.id).startsWith('vs:')) {
    const rz = e.target.closest('[data-review-drop]');
    if (rz && dragged && prKeyOf(dragged.link)) return { el: rz, cls: 'drop-into', info: { review: true } };
    const strip = e.target.closest('.lstrip');
    if (strip) return { el: strip, cls: 'drop-into', info: { linkTo: whereToTarget(strip.dataset.lwhere) } };
    if (e.target.closest('#inbox')) return { el: document.getElementById('inbox'), cls: 'drop-into', info: { linkTo: {} } };
    const pcard = e.target.closest('.project');
    if (pcard) return { el: pcard, cls: 'drop-into', info: { linkTo: { projectId: pcard.dataset.project } } };
    const tsec = e.target.closest('.thread');
    if (tsec) return { el: tsec.querySelector('.row'), cls: 'drop-into', info: { linkTo: { threadId: tsec.dataset.thread } } };
    return null;
  }
  const itemEl = e.target.closest('.item[data-item]');
  if (itemEl && itemEl.dataset.item !== drag.id) {
    const listEl = itemEl.closest('.list');
    const r = itemEl.getBoundingClientRect();
    const before = e.clientY < r.top + r.height / 2;
    return { el: itemEl, cls: before ? 'drop-before' : 'drop-after', info: { threadId: listEl.dataset.thread, kind: listEl.dataset.list, targetId: itemEl.dataset.item, before } };
  }
  if (itemEl) return null;
  const colEl = e.target.closest('.col');
  const scratchEl = e.target.closest('#scratch');
  const listEl = colEl ? colEl.querySelector('.list') : scratchEl ? scratchEl.querySelector('.scratch-list') : null;
  if (listEl) return { el: listEl, cls: 'drop-into', info: { threadId: listEl.dataset.thread, kind: listEl.dataset.list } };
  if (scratchEl) return { el: scratchEl, cls: 'drop-into', info: { threadId: '', kind: 'scratch' } };
  const sec = e.target.closest('.thread');
  if (sec) {
    const i = itemById(drag.id);
    if (i && sec.dataset.thread !== i.threadId) return { el: sec.querySelector('.row'), cls: 'drop-into', info: { threadId: sec.dataset.thread, kind: i.kind } };
  }
  return null;
}

document.addEventListener('dragstart', (e) => {
  const grip = e.target.closest && e.target.closest('[data-drag]');
  if (!grip) return;
  if (touch) return e.preventDefault();
  drag = { type: grip.dataset.drag, id: grip.dataset.id };
  const src = grip.closest(DRAG_SRC[drag.type]) || grip.closest('.prow, .lcard');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', drag.id);
  if (src) {
    e.dataTransfer.setDragImage(dragVisual(src), 12, 12);
    requestAnimationFrame(() => src.classList.add('dragging'));
  }
});

document.addEventListener('dragover', (e) => {
  const t = dropTarget(e);
  if (!t) return clearDrop();
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  markDrop(t.el, t.cls, t.info);
});

document.addEventListener('dragover', (e) => {
  if (drag || !e.target.closest || !e.target.closest('[data-review-drop]')) return;
  const types = [...(e.dataTransfer && e.dataTransfer.types || [])];
  if (!types.includes('text/uri-list') && !types.includes('text/plain')) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
  e.target.closest('[data-review-drop]').classList.add('drop-into');
});

document.addEventListener('dragleave', (e) => {
  const z = e.target.closest && e.target.closest('[data-review-drop]');
  if (z && !drag && !z.contains(e.relatedTarget)) z.classList.remove('drop-into');
});

document.addEventListener('drop', (e) => {
  if (drag || !e.target.closest || !e.target.closest('[data-review-drop]')) return;
  e.preventDefault();
  e.target.closest('[data-review-drop]').classList.remove('drop-into');
  const text = e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain');
  addReview(text.split(/\r?\n/).find((l) => l && !l.startsWith('#')) || '');
});

document.addEventListener('drop', (e) => {
  if (!drag || !dropMark) return;
  e.preventDefault();
  performDrop();
});

document.addEventListener('dragend', endDrag);

function performDrop() {
  const info = dropMark && dropMark.info;
  const d = drag;
  endDrag();
  if (!d || !info) return;
  if (info.date) return d.type === 'thread' ? setThreadDue(d.id, info.date) : setItemDue(d.id, info.date);
  if (info.linkTo && String(d.id).startsWith('vs:')) return trackSession(d.id.slice(3), info.linkTo);
  if (info.linkTo) return attachLink(d.id, info.linkTo);
  if (info.review) {
    const i = itemById(d.id);
    return i && addReview(i.link);
  }
  if (d.type === 'project') return info.projectParent !== undefined ? nestProject(d.id, info.projectParent) : moveProject(d.id, info.projectTarget, info.before);
  if (d.type === 'thread' && info.project) return setThreadProject(d.id, info.project);
  if (d.type === 'thread' && info.section) moveThreadToSection(d.id, info.section);
  else if (d.type === 'thread') moveThread(d.id, info.targetId, info.before);
  else moveItem(d.id, info);
}

function endDrag() {
  clearDrop();
  drag = null;
  document.querySelectorAll('.dragging').forEach((el) => el.classList.remove('dragging'));
}

let touch = null;
const DRAG_SRC = { thread: '.thread', item: '.item', project: '.project' };

function dragVisual(src) {
  if (src.matches('.thread')) return src.querySelector('.row');
  if (src.matches('.project')) return src.querySelector('.project-head') || src;
  return src;
}

function startTouchDrag() {
  const src = touch.handle.closest(DRAG_SRC[touch.type]) || touch.handle.closest('.prow, .lcard') || touch.handle;
  touch.active = true;
  drag = { type: touch.type, id: touch.id };
  const visual = dragVisual(src);
  const box = visual.getBoundingClientRect();
  const ghost = visual.cloneNode(true);
  ghost.className += ' ghost';
  ghost.style.width = box.width + 'px';
  touch.dx = touch.x - box.left;
  touch.dy = touch.y - box.top;
  document.body.appendChild(ghost);
  touch.ghost = ghost;
  src.classList.add('dragging');
  document.body.classList.add('touch-dragging');
  if (navigator.vibrate) navigator.vibrate(15);
  placeGhost();
  touch.raf = requestAnimationFrame(autoScroll);
}

function placeGhost() {
  touch.ghost.style.transform = 'translate(' + (touch.x - touch.dx) + 'px,' + (touch.y - touch.dy) + 'px)';
  const el = document.elementFromPoint(touch.x, touch.y);
  const t = el && dropTarget({ target: el, clientX: touch.x, clientY: touch.y });
  if (t) markDrop(t.el, t.cls, t.info);
  else clearDrop();
}

function autoScroll() {
  if (!touch || !touch.active) return;
  const edge = 70;
  const v = touch.y < edge ? -(edge - touch.y) / 4 : touch.y > innerHeight - edge ? (touch.y - innerHeight + edge) / 4 : 0;
  if (v) {
    window.scrollBy(0, v);
    placeGhost();
  }
  touch.raf = requestAnimationFrame(autoScroll);
}

function teardownTouch() {
  clearTimeout(touch.timer);
  cancelAnimationFrame(touch.raf);
  if (touch.ghost) touch.ghost.remove();
  document.body.classList.remove('touch-dragging');
  touch = null;
}

function cancelTouch() {
  if (!touch) return;
  const wasActive = touch.active;
  teardownTouch();
  if (wasActive) endDrag();
}

document.addEventListener('touchstart', (e) => {
  if (e.touches.length !== 1) return cancelTouch();
  const handle = e.target.closest && e.target.closest('[data-drag]');
  if (!handle || editingThread || editingItem) return;
  const p = e.touches[0];
  touch = { handle, type: handle.dataset.drag, id: handle.dataset.id, x: p.clientX, y: p.clientY, active: false };
  touch.timer = setTimeout(startTouchDrag, 300);
}, { passive: true });

document.addEventListener('touchmove', (e) => {
  if (!touch) return;
  const p = e.touches[0];
  if (!touch.active) {
    if (Math.hypot(p.clientX - touch.x, p.clientY - touch.y) > 8) cancelTouch();
    return;
  }
  e.preventDefault();
  touch.x = p.clientX;
  touch.y = p.clientY;
  placeGhost();
}, { passive: false });

document.addEventListener('touchend', (e) => {
  if (!touch) return;
  if (!touch.active) return cancelTouch();
  e.preventDefault();
  teardownTouch();
  performDrop();
}, { passive: false });

document.addEventListener('touchcancel', cancelTouch);

document.addEventListener('contextmenu', (e) => {
  if (touch || (lastPointer === 'touch' && e.target.closest && e.target.closest('[data-drag]'))) e.preventDefault();
});

let lastPointer = 'mouse';
document.addEventListener('pointerdown', (e) => { lastPointer = e.pointerType; }, true);

document.addEventListener('click', (e) => {
  const goEl = e.target.closest('[data-goto]');
  if (goEl && !e.target.closest('button')) return goto(goEl.dataset.goto);
  const slackOpen = e.target.closest('a[data-slack-open]');
  if (slackOpen) {
    setTimeout(() => markSlackRead(slackOpen.dataset.slackOpen), 0);
    return;
  }
  if (e.target.closest('a')) return;
  const f = e.target.closest('[data-filter]');
  if (f) {
    ui.filter = f.dataset.filter;
    saveUi();
    return render();
  }
  if (docView && e.target.id === 'docView') return closeDoc();
  if (focusOpen && !e.target.closest('#focusPanel, #focus')) {
    focusOpen = false;
    render();
  }
  const actEl = e.target.closest('[data-action]');
  if (!actEl) return;
  if (actEl.dataset.action.startsWith('focus-') && actEl.tagName === 'BUTTON') return focusAction(actEl.dataset.action, actEl);
  const action = actEl.dataset.action;
  const sec = actEl.closest('.thread');
  const tid = sec && sec.dataset.thread;
  const itemEl = actEl.closest('[data-item]');
  const iid = itemEl && itemEl.dataset.item;
  if (action === 'toggle') {
    if (e.target.closest('input, select, textarea, button, .grip')) return;
    if (actEl.closest('.pin-detail')) return;
    if (e.target.closest('.title') && lastPointer !== 'touch') return;
    if (editingThread === tid) return;
    return toggle(tid);
  }
  if (action === 'toggle-lane') {
    const id = actEl.closest('.lane').dataset.lane;
    if (ui.collapsedLanes.has(id)) ui.collapsedLanes.delete(id);
    else ui.collapsedLanes.add(id);
    saveUi();
    return render();
  }

    const s = actEl.closest('.section').dataset.section;
    if (ui.collapsedSections.has(s)) ui.collapsedSections.delete(s);
    else ui.collapsedSections.add(s);
    saveUi();
    return render();
  }
  if (action === 'move-section') return moveThreadToSection(tid, actEl.dataset.section);
  if (action === 'toggle-timeline') {
    ui.timelineOpen = !ui.timelineOpen;
    saveUi();
    return render();
  }
  if (action === 'toggle-inbox') {
    ui.inboxOpen = !ui.inboxOpen;
    saveUi();
    return render();
  }
  if (action === 'rename-link') return renameLink(iid);
  if (action === 'show-ladd') {
    laddOpen = actEl.dataset.where;
    pendingFocus = 'ladd:' + laddOpen;
    return render();
  }
  if (action === 'copy-session') return copySession(actEl.dataset.session);
  if (action === 'open-doc') return openDoc(actEl.dataset.key);
  if (action === 'close-doc') return closeDoc();
  if (action === 'copy-doc-path') {
    const d = docByKey(actEl.dataset.key);
    return d && copyText(d.path).then((ok) => showToast(ok ? 'Copied ' + tildePath(d.path) : 'Copy failed: ' + d.path, true));
  }
  if (action === 'toggle-docs') {
    if (e.target.closest('input, button')) return;
    ui.docsOpen = !ui.docsOpen;
    saveUi();
    return render();
  }
  if (action === 'docs-all') {
    ui.docsAll = !ui.docsAll;
    return render();
  }
  if (action === 'dismiss-session') return dismissSession(actEl.dataset.session);
  if (action === 'slack-read') return markSlackRead(iid);
  if (action === 'toggle-flags') {
    if (e.target.closest('button')) return;

    return render();

    ui.prsShowDone = !ui.prsShowDone;

    return render();

    ui.flagsShowAll = !ui.flagsShowAll;

    return render();

  if (action === 'summarize-slack') return summarizeSlack(actEl.dataset.key);
  if (action === 'toggle-summary') {
    summaryOpen = summaryOpen === actEl.dataset.key ? null : actEl.dataset.key;
    return render();
  }
  if (action === 'add-decisions') return addDecisions(actEl.dataset.key, actEl.dataset.thread);
  if (action === 'dismiss-slack') return dismissSlack(actEl.dataset.key);
  if (action === 'track-slack-quick') {
    const [kind, id] = actEl.dataset.to.split(':');

  if (action === 'ignore-effort') {

  if (action === 'new-project') return newProject();
  if (action === 'edit-project') return startEditProject(actEl.closest('.project').dataset.project);

  if (action === 'toggle-project-done') {

    if (!confirm('Delete the list "' + (l.name || 'Untitled') + '"' + (entries.length ? ' and its ' + entries.length + ' item' + (entries.length === 1 ? '' : 's') : '') + '?')) return;
    lists = lists.filter((x) => x !== l);
    queueDelete('Lists', l.id);
    entries.forEach((i) => queueDelete('Items', i.id));

    return render();

    if (!i) return;
    i.meta = Object.assign({}, i.meta, { seenAt: new Date().toISOString().replace(/\.\d+Z$/, 'Z') });

  if (action === 'scratch-show-done') {
    ui.scratchShowDone = !ui.scratchShowDone;
    saveUi();
    return render();
  }
  if (action === 'scratch-clear-done') return removeItems(items.filter((i) => i.kind === 'scratch' && !i.threadId && i.done && !i.meta.divider));
  if (action === 'dismiss-capture') return dismissCapture(actEl.dataset.key);
  if (action === 'board-import-dismiss') {
    ui.dismissedImports.add(actEl.dataset.import);
    saveUi();
    return render();
  }
  if (action === 'unref') {
    editDraft.refs = editDraft.refs.filter((r) => r !== actEl.dataset.ref);
    pendingFocus = 'edit:' + editingItem;
    return render();
  }
});

document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset && el.dataset.pp) return peopleChange(el);
  if (el.dataset.action === 'track-session' && el.value) {
    const [kind, id] = el.value.split(':');
    return trackSession(el.dataset.session, kind === 't' ? { threadId: id } : { projectId: id });
  }
  if (el.dataset.action === 'effort-action' && el.value) return adoptEffort(el.dataset.slug, el.value);
  if (el.dataset.action === 'track-slack' && el.value) {
    const [kind, id] = el.value.split(':');
    return trackSlack(el.dataset.key, kind === 't' ? { threadId: id } : { projectId: id });
  }
  if (el.dataset.action === 'assign-link' && el.value) {
    const [kind, id] = el.value.split(':');
    return attachLink(el.closest('[data-link]').dataset.link, kind === 't' ? { threadId: id } : { projectId: id });
  }
  if (el.dataset.action === 'set-slug') return setThreadSlug(el.closest('.thread').dataset.thread, el.value);
  if (el.dataset.action === 'set-project') return setThreadProject(el.closest('.thread').dataset.thread, el.value);
  if (el.dataset.action === 'doc-to') {
    const [kind, id] = el.value.split(':');
    if (!id || !addLink('mddoc:' + docView, kind === 't' ? 'thread:' + id : 'project:' + id)) return render();
    showToast('Added to ' + linkPlace(items.find((i) => i.link === 'mddoc:' + docView)), true);
    return render();
  }
  if (el.dataset.action === 'focus-project') {
    focusDraft.project = el.value;
    focusDraft.thread = '';
    return render();
  }
  if (el.dataset.action === 'focus-thread') {
    focusDraft.thread = el.value;
    return;
  }
  if (el.dataset.action === 'focus-category') {
    focusDraft.category = el.value;
    return;
  }
  if (el.dataset.action === 'pr-to-thread') {
    const tid = el.value;
    if (!tid || !addLink(el.dataset.url, 'thread:' + tid)) return render();
    showToast('Added to "' + (threadById(tid).title || 'Untitled') + '"', true);
    return render();
  }
  if (el.dataset.action === 'merge-into') {
    const src = el.closest('.thread').dataset.thread;
    const dst = el.value;
    el.value = '';
    return dst && mergeThread(src, dst);
  }
  if (el.dataset.action === 'set-due') return setThreadDue(el.closest('.thread').dataset.thread, el.value);
  if (el.dataset.action === 'status') {
    const t = threadById(el.closest('.thread').dataset.thread);
    t.status = el.value;
    saveThread(t);
    return render();
  }
  if (el.dataset.action === 'edit-dep' && el.value) {
    editDraft.after.push(el.value);
    pendingFocus = 'edit:' + editingItem;
    return render();
  }
  if (el.dataset.action === 'thread-dep' && el.value) {
    const t = threadById(el.closest('.thread').dataset.thread);
    t.after = (t.after || []).concat(el.value);
    saveThread(t);
    return render();
  }
  if (el.dataset.captureDec) {
    if (el.checked) captureNoDecision.delete(el.dataset.captureDec);
    else captureNoDecision.add(el.dataset.captureDec);
    return;
  }
  if (el.dataset.action === 'file-capture' && el.value) return fileCapture(el.dataset.key, el.value);
  if (el.dataset.action === 'list-kind') {
    const l = listById(el.dataset.id);
    if (!l) return;
    l.kind = el.value;
    saveList(l);
    return render();
  }
  if (el.dataset.action === 'scratch-move' && el.value) {
    const [kind, tid] = el.value.split(':');
    const t = threadById(tid);
    moveItem(el.dataset.id, { threadId: tid, kind });
    showToast('Moved to "' + (t ? t.title || 'Untitled' : 'thread') + '"', true);
    return;
  }
  if (el.dataset.action === 'board-import-parent') {
    boardImportParent[el.dataset.import] = el.value;
    return;
  }
  if (el.dataset.action === 'addref' && el.value) {
    editDraft.refs.push(el.value);
    pendingFocus = 'edit:' + editingItem;
    return render();
  }
});

document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset && el.dataset.pp) return peopleInput(el);
  if (el.dataset && el.dataset.action === 'focus-mins-input' && focusDraft) {
    focusDraft.minutes = Number(el.value) || 60;
    const btn = document.querySelector('#focusPanel .focus-start');
    if (btn) btn.textContent = 'Start ' + Math.max(5, Math.min(240, focusDraft.minutes)) + ' min';
    document.querySelectorAll('#focusPanel .focus-mins button').forEach((x) => x.classList.toggle('on', Number(x.dataset.mins) === focusDraft.minutes));
    return;
  }
  if (el.dataset && el.dataset.action === 'docs-q') {
    ui.docsQuery = el.value;
    return render();
  }
  if (el.dataset && el.dataset.action === 'focus-note') {
    focusDraft = Object.assign(focusDraft || {}, { note: el.value });
    return;
  }
  if (el.tagName === 'TEXTAREA') autosize(el);
  if (editDraft && el.closest('[data-editor]')) {
    if (el.classList.contains('e-text')) editDraft.text = el.value;
    if (el.classList.contains('e-link')) editDraft.link = el.value;
    if (el.classList.contains('e-due')) editDraft.due = el.value;
  }
  if (el.classList && el.classList.contains('pname-input') && projectDraft) projectDraft.name = el.value;

window.addEventListener('resize', () => requestAnimationFrame(drawBoardArrows));

document.addEventListener('keydown', (e) => {
  const el = e.target;
  if (el.dataset && el.dataset.pp) return peopleKey(e);
  if (docView && e.key === 'Escape') return closeDoc();
  const enterSaves = e.key === 'Enter' && !e.shiftKey && !e.isComposing;
  if (el.classList && el.classList.contains('ladd') && e.key === 'Escape' && laddOpen) {
    laddOpen = null;
    return render();
  }
  if (el.classList && el.classList.contains('pname-input')) {
    if (e.key === 'Escape') commitProject(true);
    return;
  }
  if (el.classList && el.classList.contains('title-input')) {
    if (e.key === 'Escape') commitTitle(editingThread, el.value, true);
    return;
  }
  if (el.closest && el.closest('[data-editor]')) {
    if (enterSaves && el.tagName !== 'SELECT') { e.preventDefault(); commitEdit(false); }
    if (e.key === 'Escape') commitEdit(true);
    return;
  }
  if (el.dataset && el.dataset.add) {
    if (enterSaves && el.tagName === 'TEXTAREA') {
      e.preventDefault();
      submitAdd(el);
    }
    if (e.key === 'Escape') el.blur();
    return;
  }
  if (el.id === 'search') {
    if (e.key === 'Escape') { el.value = ''; el.blur(); render(); }
    return;
  }
  if (/INPUT|TEXTAREA|SELECT/.test(el.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'n') { e.preventDefault(); newThread(); }
  if (e.key === '/') { e.preventDefault(); document.getElementById('search').focus(); }
});

function submitAdd(el) {
  if (el.dataset.add === 'entry') {
    addEntry(el.dataset.list, el.value);
    el.value = '';
    pendingFocus = 'add:entry:' + el.dataset.list;
    return render();
  }
  if (el.dataset.add === 'scratch') {
    const text = el.value.trim();
    el.value = '';
    if (!text) return;
    const pos = itemsOf('', 'scratch').reduce((m, x) => Math.max(m, x.position), -1) + 1;
    const i = normItem({ id: uid(), threadId: '', projectId: '', kind: 'scratch', text, done: false, position: pos, created: now() });
    items.push(i);
    saveItem(i);
    pendingFocus = 'add:scratch';
    return render();
  }
  const tid = el.closest('.thread').dataset.thread;
  const text = el.value;
  el.value = '';
  addItem(tid, el.dataset.add, text);
}

document.addEventListener('submit', (e) => {
  e.preventDefault();
  const form = e.target;
  if (form.dataset.ppForm) return savePDraft();
  if (form.dataset.addForm) return submitAdd(form.querySelector('[data-add]'));
  if (form.dataset.ladd) {
    const input = form.querySelector('.ladd');
    if (addLink(input.value, form.dataset.ladd)) {
      input.value = '';
      laddOpen = null;
    }
    return render();
  }
  if (form.dataset.listNew) {
    const name = form.querySelector('input').value.trim();
    if (!name) return;
    form.querySelector('input').value = '';
    const l = normList({ id: uid(), name, kind: form.querySelector('select').value, position: lists.reduce((m, x) => Math.max(m, x.position), -1) + 1, created: now() });
    lists.push(l);
    saveList(l);
    pendingFocus = 'add:entry:' + l.id;
    return render();
  }
  if (form.dataset.listRename) {
    const l = listById(form.dataset.listRename);
    const v = form.querySelector('input').value.trim();
    listEditing = null;
    if (l && v && v !== l.name) {
      l.name = v;
      saveList(l);
    }
    return render();
  }
  if (form.dataset.reviewForm) {
    const input = form.querySelector('input');
    if (addReview(input.value)) input.value = '';
    pendingFocus = 'review-add';
    return render();
  }
  if (form.dataset.boardAdd) {
    const input = form.querySelector('input');
    const tid = form.dataset.boardAdd;
    const text = input.value;
    input.value = '';
    if (text.trim()) addItem(tid, 'task', text);
    pendingFocus = 'badd:' + tid;
    return render();
  }
  if (form.dataset.boardStage) {
    const input = form.querySelector('input');
    const title = input.value.trim();
    if (!title) return;
    input.value = '';
    const pid = form.dataset.boardStage;
    const t = normThread({ id: uid(), title, status: 'active', position: threads.reduce((m, x) => Math.max(m, x.position), -1) + 1, created: now(), updated: now(), section: 'later', project: pid });
    const cols = boardColumns(pid);
    t.after = cols.length ? [cols[cols.length - 1].id] : [];
    threads.push(t);
    saveThread(t);
    pendingFocus = 'badd:' + t.id;
    return render();
  }
  if (form.dataset.flagForm) {
    const input = form.querySelector('input');
    if (trackFlag(input.value)) input.value = '';
    pendingFocus = 'flag-add';
    return render();
  }
  if (form.dataset.projectForm) {
    readProjectForm();
    return commitProject(false);
  }
  if (form.dataset.titleForm && editingThread) commitTitle(editingThread, form.querySelector('input').value, false);
});

document.addEventListener('focusout', (e) => {
  if (rendering) return;
  const el = e.target;
  if (el.classList && el.classList.contains('title-input') && editingThread) {
    setTimeout(() => { if (editingThread && !rendering) commitTitle(editingThread, el.value, false); }, 0);
    return;
  }
  const editor = el.closest && el.closest('[data-editor]');
  if (editor && editingItem && !(e.relatedTarget && editor.contains(e.relatedTarget))) {
    setTimeout(() => {
      if (editingItem && !editor.contains(document.activeElement)) commitEdit(false);
    }, 0);
  }
});

const POLL_IDLE_MS = POLL_ACTIVE_MS * 4;
const IDLE_AFTER_MS = 10 * 60000;
let lastInput = Date.now();
let lastAttempt = 0;
let lastSig = '';

function canPoll() {
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  return document.visibilityState === 'visible' && !pending.size && !inFlight && !loading
    && !editingItem && !editingThread && !drag && !touch && !/INPUT|TEXTAREA|SELECT/.test(tag);

function syncSoon() {

// ---------------------------------------------------------------- People: who you saw, and when
// Sheet tabs: People (id, name, note), Events (id, date, time, title, note), Seen (id, eventId, personId, note).

const PP_RANGES = { '3m': 91, '6m': 183, '1y': 365, all: 0 };
const PP_SORTS = { since: 'Longest since', recent: 'Most recent', count: 'Most seen', name: 'Name' };
const pui = Object.assign({ tab: 'timeline', range: '6m', sort: 'since' }, storeGet('threads-people-ui') || {});
let pDraft = null;
let pPerson = null;
let pPersonEdit = false;
let pFilter = '';
let pLanesScrolled = '';

function savePui() { storeSet('threads-people-ui', { tab: pui.tab, range: pui.range, sort: pui.sort }); }
function isPeopleView() { return location.hash === '#people'; }
function pDay(date) { const p = String(date).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }

function pDate(v) {
  v = String(v == null ? '' : v).trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  const d = v ? new Date(v) : null;
  return d && !isNaN(d) ? ymd(d) : '';
}

function pTime(v) {
  v = String(v == null ? '' : v).trim();
  const m = v.match(/^(\d{1,2}):(\d{2})/);
  if (m) return pad2(m[1]) + ':' + m[2];
  if (v.includes('T')) {
    const d = new Date(v);
    if (!isNaN(d)) return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }
  return '';
}

function normPerson(r) { return { id: String(r.id), name: String(r.name || '').trim(), note: String(r.note || ''), created: r.created || '', updated: r.updated || '' }; }
function normPEvent(r) { return { id: String(r.id), date: pDate(r.date), time: pTime(r.time), title: String(r.title || ''), note: String(r.note || ''), created: r.created || '', updated: r.updated || '' }; }
function normSeen(r) { return { id: String(r.id), eventId: String(r.eventId || ''), personId: String(r.personId || ''), note: String(r.note || ''), created: r.created || '', updated: r.updated || '' }; }

function personById(id) { return people.find((p) => p.id === id) || null; }
function pEventById(id) { return pevents.find((e) => e.id === id) || null; }
function evKey(e) { return e.date + ' ' + (e.time || '99:99'); }
function sortedPEvents() { return pevents.filter((e) => e.date).sort((a, b) => (evKey(a) < evKey(b) ? 1 : evKey(a) > evKey(b) ? -1 : 0)); }
function pName(id) { const p = personById(id); return p ? p.name || 'Unnamed' : 'Unknown'; }

function pStats() {
  const ev = new Map(pevents.map((e) => [e.id, e]));
  const st = new Map(people.map((p) => [p.id, { hist: [], last: '', first: '', count: 0 }]));
  seen.forEach((s) => {
    const e = ev.get(s.eventId);
    const x = st.get(s.personId);
    if (e && x && e.date) x.hist.push({ e, s });
  });
  st.forEach((x) => {
    x.hist.sort((a, b) => (evKey(a.e) < evKey(b.e) ? 1 : -1));
    const past = x.hist.filter((h) => daysSince(h.e.date) >= 0);
    x.count = x.hist.length;
    x.last = past.length ? past[0].e.date : '';
    x.first = x.hist.length ? x.hist[x.hist.length - 1].e.date : '';
  });
  return st;
}

function daysSince(date) {
  if (!date) return null;
  const a = pDay(date);
  const t = new Date();
  return Math.round((Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()) - Date.UTC(a.getFullYear(), a.getMonth(), a.getDate())) / DAY_MS);
}

function sinceLabel(n) {
  if (n == null) return 'not yet';
  if (n < 0) return 'in ' + (-n) + (n === -1 ? ' day' : ' days');
  if (n === 0) return 'today';
  if (n === 1) return 'yesterday';
  if (n < 14) return n + ' days ago';
  if (n < 60) return Math.round(n / 7) + ' weeks ago';
  if (n < 730) return Math.round(n / 30.44) + ' months ago';
  return (n / 365.25).toFixed(1).replace(/\.0$/, '') + ' years ago';
}

function sinceShort(n) {
  if (n == null) return '-';
  if (n < 0) return 'soon';
  if (n === 0) return 'today';
  if (n < 60) return n + 'd';
  if (n < 730) return Math.round(n / 30.44) + 'mo';
  return (n / 365.25).toFixed(1).replace(/\.0$/, '') + 'y';
}

function staleClass(n) { return n == null ? 'pp-never' : n <= 30 ? 'pp-fresh' : n <= 90 ? 'pp-mid' : n <= 180 ? 'pp-old' : 'pp-cold'; }

function dateLabel(date, long) {
  if (!date) return '';
  const d = pDay(date);
  const opts = { weekday: 'short', month: 'short', day: 'numeric' };
  if (long || d.getFullYear() !== new Date().getFullYear()) opts.year = 'numeric';
  return d.toLocaleDateString(undefined, opts);
}

function timeLabel(t) {
  if (!t) return '';
  const p = t.split(':').map(Number);
  return new Date(2000, 0, 1, p[0], p[1]).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
}

function newPDraft(date) { return { id: '', date: date || ymd(new Date()), time: '', title: '', who: [], q: '', hi: 0 }; }

function whoKey(w) { return w.personId || 'n:' + w.name.toLowerCase(); }

function pSuggestions() {
  const d = pDraft;
  const q = d.q.trim().toLowerCase();
  if (!q) return [];
  const st = pStats();
  const taken = new Set(d.who.map((w) => w.personId).filter(Boolean));
  const takenNames = new Set(d.who.map((w) => w.name.toLowerCase()));
  const score = (p) => {
    const n = p.name.toLowerCase();
    return n.startsWith(q) ? 0 : n.split(/\s+/).some((w) => w.startsWith(q)) ? 1 : n.includes(q) ? 2 : 9;
  };
  const out = people.filter((p) => p.name && !taken.has(p.id) && score(p) < 9)
    .sort((a, b) => score(a) - score(b) || st.get(b.id).count - st.get(a.id).count || a.name.localeCompare(b.name))
    .slice(0, 6)
    .map((p) => ({ id: p.id, name: p.name, sub: st.get(p.id).last ? 'seen ' + sinceLabel(daysSince(st.get(p.id).last)) : 'not seen yet' }));
  if (!people.some((p) => p.name.toLowerCase() === q) && !takenNames.has(q)) out.push({ id: '', name: d.q.trim(), sub: 'add as a new person' });
  return out;
}

function pOften() {
  const st = pStats();
  const taken = new Set(pDraft.who.map((w) => w.personId));
  return people.filter((p) => p.name && !taken.has(p.id) && st.get(p.id).count)
    .sort((a, b) => (st.get(b.id).last > st.get(a.id).last ? 1 : st.get(b.id).last < st.get(a.id).last ? -1 : 0) || st.get(b.id).count - st.get(a.id).count)
    .slice(0, 8);
}

function pSuggHtml() {
  if (!pDraft.q.trim()) {
    const often = pOften();
    return often.length ? '<div class="pp-often"><span class="muted">Recent:</span>' + often.map((p) => '<button type="button" class="chip" data-action="pp-pick" data-id="' + p.id + '">' + esc(p.name) + '</button>').join('') + '</div>' : '';
  }
  const list = pSuggestions();
  if (pDraft.hi >= list.length) pDraft.hi = Math.max(0, list.length - 1);
  return '<div class="pp-drop">' + list.map((s, n) => '<button type="button" class="pp-sug' + (n === pDraft.hi ? ' hi' : '') + '" data-action="pp-pick" data-id="' + s.id + '" data-name="' + esc(s.name) + '">'
    + (s.id ? '' : '+ ') + esc(s.name) + '<span class="muted">' + esc(s.sub) + '</span></button>').join('') + '</div>';
}

function refreshSugg() {
  const el = document.getElementById('pp-sugg');
  if (el) el.innerHTML = pSuggHtml();
}

function addWho(id, name) {
  const d = pDraft;
  if (id) {
    const p = personById(id);
    if (!p || d.who.some((w) => w.personId === id)) return;
    d.who.push({ personId: id, name: p.name, note: '' });
  } else {
    name = String(name || '').trim().replace(/\s+/g, ' ');
    if (!name) return;
    const ex = people.find((p) => p.name.toLowerCase() === name.toLowerCase());
    if (ex) return addWho(ex.id);
    if (d.who.some((w) => w.name.toLowerCase() === name.toLowerCase())) return;
    d.who.push({ personId: '', name, note: '' });
  }
}

function pickHighlighted() {
  const list = pSuggestions();
  const s = list[pDraft.hi] || list[0];
  if (s) addWho(s.id, s.name);
  else if (pDraft.q.trim()) addWho('', pDraft.q);
  pDraft.q = '';
  pDraft.hi = 0;
}

    + '<div class="pp-log-head"><b>' + (editing ? 'Edit event' : 'Log who you saw') + '</b><span class="spacer"></span>'
    + (editing ? '<button type="button" data-action="pp-cancel">Cancel</button>' : '') + '</div>'
    + '<div class="pp-when"><label>Day<input type="date" data-pp="date" value="' + esc(d.date) + '" required></label>'
    + '<label><span>Time <span class="muted">optional</span></span><input type="time" data-pp="time" value="' + esc(d.time) + '"></label></div>'

    + '<datalist id="pp-titles">' + titles.map((t) => '<option value="' + esc(t) + '">').join('') + '</datalist>'

      + '<input class="pp-wnote" data-pp="who-note" data-key="' + esc(whoKey(w)) + '" data-focus="pp-who:' + esc(whoKey(w)) + '" value="' + esc(w.note) + '" placeholder="note (optional)" autocomplete="off" enterkeyhint="next">'
      + '<button type="button" class="x" data-action="pp-who-remove" data-key="' + esc(whoKey(w)) + '" title="Remove">x</button></div>').join('') + '</div>' : '')
    + '<div class="pp-add"><input data-pp="q" data-focus="pp-q" value="' + esc(d.q) + '" placeholder="Type a name, Enter to add" autocomplete="off" autocapitalize="words" enterkeyhint="enter">'
    + '<div id="pp-sugg">' + pSuggHtml() + '</div></div>'
    + '<div class="pp-actions">' + (editing ? '<button type="button" class="danger" data-action="pp-delete-event">Delete event</button>' : '')
    + '<span class="spacer"></span><button class="primary" type="submit">' + (editing ? 'Save changes' : 'Save') + '</button></div>'
    + '</form>';
}

function pChipsHtml(e) {
  const rows = seen.filter((s) => s.eventId === e.id).sort((a, b) => pName(a.personId).localeCompare(pName(b.personId)));
  if (!rows.length) return '<div class="muted pp-none">No one added</div>';
  return '<div class="pp-chips">' + rows.map((s) => '<span class="pp-pchip"><button type="button" class="linkish" data-action="pp-person" data-id="' + s.personId + '">' + esc(pName(s.personId)) + '</button>'
    + (s.note ? '<span class="pp-pnote">' + esc(s.note) + '</span>' : '') + '</span>').join('') + '</div>';

function ppTimelineHtml() {
  const evs = sortedPEvents();
  if (!evs.length) return '<div class="pp-empty">Nothing logged yet. Add the first event with the form.</div>';
  let month = '';
  return evs.map((e) => {

    const m = d.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    const head = m !== month ? '<div class="pp-month">' + esc(m) + '</div>' : '';
    month = m;
    return head + '<div class="pp-ev' + (pDraft.id === e.id ? ' editing' : '') + '" data-ev="' + e.id + '">'
      + '<div class="pp-day"><b>' + d.getDate() + '</b><span>' + d.toLocaleDateString(undefined, { weekday: 'short' }) + '</span></div>'
